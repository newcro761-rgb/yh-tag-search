<meta charset="utf-8">
<title>설비 태그 검색</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  try {
    var saved = localStorage.getItem('tagsearch-theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-raised: #ffffff;
    --bg-sunken: #eceef1;
    --fg: #1a1d21;
    --fg-muted: #5b6470;
    --fg-faint: #8b93a0;
    --border: #d7dbe0;
    --border-strong: #b9c0c9;
    --accent: #0f6e7a;
    --accent-fg: #ffffff;
    --accent-soft-bg: #e2f1f2;
    --accent-soft-fg: #0a4d56;
    --focus: #0f6e7a;

    --trip-bg: #fbe6e3;
    --trip-fg: #8f2c1f;
    --trip-stripe: #c0392b;
    --interlock-bg: #fbebd6;
    --interlock-fg: #7a4a00;
    --protection-bg: #efe4f7;
    --protection-fg: #5b2c82;
    --annunciator-bg: #faf1cf;
    --annunciator-fg: #6b5400;
    --sequence-bg: #dfe9f7;
    --sequence-fg: #1e4a80;
    --control-bg: #e3eeee;
    --control-fg: #2c5c5c;

    --confirmed-bg: #dff0e6;
    --confirmed-fg: #206a44;
    --mentioned-bg: #eceef1;
    --mentioned-fg: #5b6470;

    --shadow: 0 1px 2px rgba(20, 24, 28, 0.06), 0 1px 1px rgba(20, 24, 28, 0.04);
    --radius: 10px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Roboto Mono", "Consolas", "Malgun Gothic", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --bg-raised: #1c2024;
      --bg-sunken: #101315;
      --fg: #e8eaed;
      --fg-muted: #9aa3ad;
      --fg-faint: #6b7480;
      --border: #2c3238;
      --border-strong: #3c444c;
      --accent: #4fb8c4;
      --accent-fg: #06282c;
      --accent-soft-bg: #17383c;
      --accent-soft-fg: #8fdbe3;
      --focus: #4fb8c4;

      --trip-bg: #3a1e1a;
      --trip-fg: #f3a396;
      --trip-stripe: #e0574a;
      --interlock-bg: #3a2c14;
      --interlock-fg: #f0c37c;
      --protection-bg: #2c2038;
      --protection-fg: #cba6ec;
      --annunciator-bg: #342f14;
      --annunciator-fg: #e8d17e;
      --sequence-bg: #17263a;
      --sequence-fg: #9dc2ef;
      --control-bg: #1a2c2c;
      --control-fg: #8fc7c7;

      --confirmed-bg: #163b28;
      --confirmed-fg: #7fd6a6;
      --mentioned-bg: #23282d;
      --mentioned-fg: #9aa3ad;

      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171a;
    --bg-raised: #1c2024;
    --bg-sunken: #101315;
    --fg: #e8eaed;
    --fg-muted: #9aa3ad;
    --fg-faint: #6b7480;
    --border: #2c3238;
    --border-strong: #3c444c;
    --accent: #4fb8c4;
    --accent-fg: #06282c;
    --accent-soft-bg: #17383c;
    --accent-soft-fg: #8fdbe3;
    --focus: #4fb8c4;
    --trip-bg: #3a1e1a; --trip-fg: #f3a396; --trip-stripe: #e0574a;
    --interlock-bg: #3a2c14; --interlock-fg: #f0c37c;
    --protection-bg: #2c2038; --protection-fg: #cba6ec;
    --annunciator-bg: #342f14; --annunciator-fg: #e8d17e;
    --sequence-bg: #17263a; --sequence-fg: #9dc2ef;
    --control-bg: #1a2c2c; --control-fg: #8fc7c7;
    --confirmed-bg: #163b28; --confirmed-fg: #7fd6a6;
    --mentioned-bg: #23282d; --mentioned-fg: #9aa3ad;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --bg-raised: #ffffff;
    --bg-sunken: #eceef1;
    --fg: #1a1d21;
    --fg-muted: #5b6470;
    --fg-faint: #8b93a0;
    --border: #d7dbe0;
    --border-strong: #b9c0c9;
    --accent: #0f6e7a;
    --accent-fg: #ffffff;
    --accent-soft-bg: #e2f1f2;
    --accent-soft-fg: #0a4d56;
    --focus: #0f6e7a;
    --trip-bg: #fbe6e3; --trip-fg: #8f2c1f; --trip-stripe: #c0392b;
    --interlock-bg: #fbebd6; --interlock-fg: #7a4a00;
    --protection-bg: #efe4f7; --protection-fg: #5b2c82;
    --annunciator-bg: #faf1cf; --annunciator-fg: #6b5400;
    --sequence-bg: #dfe9f7; --sequence-fg: #1e4a80;
    --control-bg: #e3eeee; --control-fg: #2c5c5c;
    --confirmed-bg: #dff0e6; --confirmed-fg: #206a44;
    --mentioned-bg: #eceef1; --mentioned-fg: #5b6470;
    --shadow: 0 1px 2px rgba(20, 24, 28, 0.06), 0 1px 1px rgba(20, 24, 28, 0.04);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent-soft-bg); color: var(--accent-soft-fg); }

  a { color: var(--accent); }

  button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
  }
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- header / search ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .search-form {
    flex: 1;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 4px 4px 4px 12px;
    box-shadow: var(--shadow);
  }
  .search-form:focus-within { border-color: var(--focus); }
  .search-form input[type="search"] {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 16px;
    letter-spacing: 0.02em;
    padding: 10px 0;
    min-width: 0;
  }
  .search-form input[type="search"]::placeholder { color: var(--fg-faint); font-family: var(--font-ui); letter-spacing: normal; }
  .search-form input[type="search"]:focus { outline: none; }
  .search-form button[type="submit"] {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 7px;
    padding: 0 16px;
    height: 40px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .search-form button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  .theme-toggle {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--bg-raised);
    color: var(--fg-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle svg { width: 18px; height: 18px; }

  main { flex: 1; padding: 14px 14px 48px; display: flex; flex-direction: column; gap: 14px; }

  /* ---- intro / chips ---- */
  .intro { padding: 24px 4px 4px; }
  .intro h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .intro p { margin: 0; color: var(--fg-muted); font-size: 14px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    border-radius: 999px;
    padding: 7px 13px;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .chip-label { font-size: 12px; color: var(--fg-faint); margin: 18px 0 0; text-transform: uppercase; letter-spacing: 0.06em; }

  /* ---- cards / sections ---- */
  .card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-pad { padding: 16px; }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-faint);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* summary card */
  .summary-tag {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .summary-desc { color: var(--fg-muted); font-size: 14px; margin: 4px 0 0; }
  .summary-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    line-height: 1.6;
    white-space: nowrap;
  }
  .badge-trip { background: var(--trip-bg); color: var(--trip-fg); }
  .badge-interlock { background: var(--interlock-bg); color: var(--interlock-fg); }
  .badge-protection { background: var(--protection-bg); color: var(--protection-fg); }
  .badge-annunciator { background: var(--annunciator-bg); color: var(--annunciator-fg); }
  .badge-sequence { background: var(--sequence-bg); color: var(--sequence-fg); }
  .badge-control { background: var(--control-bg); color: var(--control-fg); }
  .badge-confirmed { background: var(--confirmed-bg); color: var(--confirmed-fg); }
  .badge-mentioned { background: var(--mentioned-bg); color: var(--mentioned-fg); }

  /* P&ID drawing block */
  .pid-block { padding: 16px; }
  .pid-item + .pid-item { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .pid-number-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pid-number {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.01em;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .pid-copy {
    flex-shrink: 0;
    border: 1px solid var(--border-strong);
    background: var(--bg-sunken);
    color: var(--fg-muted);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    min-height: 36px;
  }
  .pid-copy.copied { background: var(--confirmed-bg); color: var(--confirmed-fg); border-color: transparent; }
  .pid-open {
    flex-shrink: 0;
    border: 1px solid transparent;
    background: var(--confirmed-bg);
    color: var(--confirmed-fg);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .pid-title { font-size: 13px; color: var(--fg-muted); margin-top: 4px; }
  .pid-confidence { font-size: 11px; color: var(--fg-faint); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* trip banner */
  .banner {
    display: flex;
    gap: 10px;
    padding: 13px 14px;
    border-radius: var(--radius);
    background: var(--trip-bg);
    color: var(--trip-fg);
    font-size: 13.5px;
    line-height: 1.55;
    border: 1px solid transparent;
  }
  .banner svg { flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; }
  .banner strong { font-weight: 700; }

  /* logic list */
  .logic-list { display: flex; flex-direction: column; }
  .logic-item {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    position: relative;
  }
  .logic-item:first-child { border-top: none; }
  .logic-item.is-trip { border-left: 3px solid var(--trip-stripe); }
  .logic-item.is-trip:not(.is-first-item) { margin-top: -1px; }
  .logic-sheet-no {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--fg-muted);
    flex-shrink: 0;
    min-width: 52px;
    padding-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .logic-body { flex: 1; min-width: 0; }
  .logic-title { font-size: 14px; font-weight: 500; word-break: keep-all; }
  .logic-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .logic-page { font-size: 11.5px; color: var(--fg-faint); margin-top: 4px; }

  /* instrument dl */
  .kv-list { display: flex; flex-direction: column; }
  .kv-row {
    display: flex;
    gap: 14px;
    padding: 9px 16px;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
  }
  .kv-row:first-child { border-top: none; }
  .kv-row dt { color: var(--fg-faint); flex: 0 0 88px; font-size: 12.5px; padding-top: 1px; }
  .kv-row dd { margin: 0; flex: 1; font-family: var(--font-mono); word-break: break-word; }
  .instrument-block + .instrument-block { border-top: 1px solid var(--border); }
  .instrument-heading {
    padding: 10px 16px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--fg);
  }

  /* collapsible sections */
  details.card { padding: 0; }
  details > summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-faint);
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { transition: transform 0.15s ease; flex-shrink: 0; }
  details[open] > summary .chev { transform: rotate(90deg); }
  details > summary .count { font-family: var(--font-mono); color: var(--fg-muted); font-weight: 400; text-transform: none; letter-spacing: normal; }
  details > .details-body { padding: 0 16px 16px; }
  details > .details-body.no-pad-top { padding-top: 0; }

  .stage-pill { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.5; padding: 0 7px; margin-left: 6px; border-radius: 999px; background: var(--accent-soft-bg); color: var(--accent-soft-fg); font-family: var(--font-ui); vertical-align: middle; }
  .tag-note-text { white-space: pre-wrap; margin: 6px 0 0; font-size: 14px; line-height: 1.6; }
  .tag-note-src { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--fg-muted); }
  .auto-muted { font-size: 12px; color: var(--fg-muted); margin: 6px 0 0; }
  .auto-line { font-size: 13.5px; line-height: 1.6; margin: 8px 0 0; }
  .auto-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 0; }
  .auto-chip { font-size: 12px; background: var(--bg-sunken); border-radius: 4px; padding: 2px 6px; }
  .auto-trip { background: var(--trip-bg); color: var(--trip-fg); border-left: 3px solid var(--trip-stripe); border-radius: 6px; padding: 10px 12px; margin: 10px 0 0; }
  .auto-trip-head { font-weight: 700; font-size: 13.5px; margin: 0 0 6px; }
  .auto-trip-path { font-size: 13px; line-height: 1.5; margin: 4px 0 0; }
  .auto-trip-basis { font-size: 11.5px; opacity: .8; margin-left: 6px; }
  .ai-note { border-left: 3px solid var(--fg-faint); padding: 2px 0 8px 12px; margin: 0 0 12px; }
  .ai-note-head { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg-muted); }
  .ai-note-summary { font-weight: 500; }
  .ai-note-more { margin: 6px 0 0; }
  .ai-note-more > summary { cursor: pointer; font-size: 12.5px; color: var(--fg-muted); }
  .ai-note-uncertain { margin: 6px 0 0; font-size: 12.5px; color: var(--fg-muted); }
  .tag-note-review, .conflict-note { font-size: 12px; color: var(--fg-faint); margin: 6px 0 0; }
  .conflict-attr { font-weight: 700; font-size: 13px; margin: 10px 0 4px; }
  .conflict-val { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--border); }
  .conflict-val-v { font-family: var(--font-mono); font-weight: 600; }
  .conflict-val-src { color: var(--fg-muted); }
  .dwg-alias { font-size: 11.5px; color: var(--fg-faint); font-weight: 400; font-family: var(--font-ui); }
  details.dwg-guide { margin-top: 8px; font-size: 12.5px; color: var(--fg-muted); }
  details.dwg-guide > summary { padding: 8px 4px; font-size: 12px; text-transform: none; letter-spacing: normal; font-weight: 600; justify-content: flex-start; }
  details.dwg-guide .dwg-guide-body { padding: 0 4px 8px; }
  details.dwg-guide h4 { margin: 10px 0 4px; font-size: 12.5px; color: var(--fg); }
  details.dwg-guide p { margin: 4px 0; }
  details.dwg-guide table { border-collapse: collapse; width: 100%; font-size: 12px; }
  details.dwg-guide th, details.dwg-guide td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; vertical-align: top; }
  details.dwg-guide td:nth-child(2) { font-family: var(--font-mono); white-space: nowrap; }
  details.dwg-guide code { font-family: var(--font-mono); }
  .dwg-guide-note { color: var(--fg-faint); font-size: 11.5px; }

  .related-group + .related-group { margin-top: 14px; }
  .related-group-title { font-size: 12.5px; font-weight: 700; color: var(--fg-muted); margin: 0 0 6px; }
  .related-item { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border); }
  .related-item:first-child { border-top: none; }
  .related-dwg { font-family: var(--font-mono); font-weight: 600; }
  .related-title { color: var(--fg-muted); margin-top: 2px; }

  .manual-item { font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--border); }
  .manual-item:first-child { border-top: none; }
  .manual-page { font-family: var(--font-mono); color: var(--fg-faint); font-size: 12px; }
  .manual-excerpt { color: var(--fg-muted); font-size: 12.5px; margin-top: 4px; line-height: 1.5; }

  .diag-line { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-faint); padding: 3px 0; word-break: break-all; }

  /* status states */
  .state-block { padding: 32px 20px; text-align: center; color: var(--fg-muted); }
  .state-block .state-title { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
  .state-block .state-desc { font-size: 13.5px; line-height: 1.6; }
  .retry-btn {
    margin-top: 14px;
    border: 1px solid var(--border-strong);
    background: var(--bg-sunken);
    color: var(--fg);
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .variant-tried {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .variant-tried span { background: var(--bg-sunken); padding: 3px 8px; border-radius: 6px; }

  .skeleton {
    background: linear-gradient(90deg, var(--bg-sunken) 25%, var(--border) 37%, var(--bg-sunken) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none; }
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .skeleton-card { padding: 16px; }
  .skeleton-line { height: 14px; margin-bottom: 8px; }
  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w40 { width: 40%; }
  .skeleton-line.w80 { width: 80%; }

  .loading-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--fg-faint);
    padding: 2px 4px;
  }
  .spinner {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: spin 1.6s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

<script>
(function () {
  'use strict';

  // ======================================================================
  // §0 접근 게이트 — PIN 해시 비교 (완전한 보안이 아니라 링크 유출 시 즉시 열람을 막는 최소 문턱)
  // ======================================================================
  var GATE_HASH = '30606ac3b4fd5c618ac4c6555ce007edd7fe73d75b685320aa56be211ebc4b40';
  var GATE_SESSION_KEY = 'tagsearch-gate-ok';

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
      var bytes = new Uint8Array(buf);
      var hex = '';
      for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
      return hex;
    });
  }

  var gateScreen = document.getElementById('gateScreen');
  var appRoot = document.getElementById('appRoot');
  var gateForm = document.getElementById('gateForm');
  var gateInput = document.getElementById('gateInput');
  var gateError = document.getElementById('gateError');

  function unlockApp() {
    gateScreen.style.display = 'none';
    appRoot.style.display = '';
    initApp();
  }

  var alreadyUnlocked = false;
  try { alreadyUnlocked = sessionStorage.getItem(GATE_SESSION_KEY) === '1'; } catch (e) {}

  if (alreadyUnlocked) {
    unlockApp();
  } else {
    gateInput.focus();
    gateForm.addEventListener('submit', function (e) {
      e.preventDefault();
      sha256Hex(gateInput.value).then(function (hash) {
        if (hash === GATE_HASH) {
          try { sessionStorage.setItem(GATE_SESSION_KEY, '1'); } catch (err) {}
          unlockApp();
        } else {
          gateError.textContent = 'PIN이 올바르지 않습니다.';
          gateInput.value = '';
          gateInput.focus();
        }
      });
    });
  }

  // ======================================================================
  // §1 설정 (initApp 내부에서 실행 — PIN 통과 후에만 동작)
  // ======================================================================
  function initApp() {
  var MCP_URL = 'https://plant-assistant-mcp.newcro761.workers.dev/mcp/2Gr6faXzdeHBxjNbc1kU7YCrufw42BmmRvtdEHRBbfkweMKwSF5vEckX0_WWT9bO';

  // 도면 파일 서빙 베이스 URL(미니PC rclone serve + Cloudflare Tunnel).
  // 비워두면 '열기' 링크를 아예 만들지 않는다 — 주소가 정해지면 여기만 채우면 된다.
  var DRAWING_BASE_URL = 'https://files.plantassist-nth.com';

  // file_path는 구글드라이브 '003 업무' 기준 상대경로이고 한글·공백을 포함한다.
  // 세그먼트별로 인코딩해야 슬래시가 보존된다(전체를 한 번에 인코딩하면 깨짐).
  function drawingUrl(filePath) {
    if (!DRAWING_BASE_URL || !filePath) return null;
    // DB에 맥 절대경로가 남아 있는 행이 있어 Worker에서 정규화하고 있지만,
    // 혹시 새는 값이 있어도 링크가 깨지지 않도록 여기서도 한 번 더 자른다.
    var rel = String(filePath).split(String.fromCharCode(92)).join('/');
    var i = rel.indexOf('003 업무/');
    if (i >= 0) rel = rel.slice(i + '003 업무/'.length);
    rel = rel.replace(/^\/+/, '');
    return DRAWING_BASE_URL.replace(/\/+$/, '') + '/' +
      rel.split('/').map(encodeURIComponent).join('/');
  }
  var CALL_TIMEOUT_MS = 15000;
  var RECENT_KEY = 'tagsearch-recent';
  var THEME_KEY = 'tagsearch-theme';
  var EXAMPLE_TAGS = [
    { value: 'CW-MV03B', label: 'CW-MV03B' },
    { value: 'HO-PSLL41A', label: 'HO-PSLL41A' },
    { value: 'MS-PT', label: 'MS-PT (번호 생략 검색)' },
    { value: 'Governor Free', label: 'Governor Free (로직 키워드 검색)' }
  ];

  var results = document.getElementById('results');
  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');
  var searchBtn = document.getElementById('searchBtn');

  // ======================================================================
  // §2 MCP 클라이언트 — 세션 관리 / SSE 파싱 / 재시도
  // ======================================================================
  var sessionId = null;
  var sessionPromise = null;
  var callIdSeq = 1;

  function McpError(kind, message) {
    this.kind = kind;
    this.message = message;
  }
  McpError.prototype = Object.create(Error.prototype);

  function ensureSession() {
    if (sessionId) return Promise.resolve(sessionId);
    if (sessionPromise) return sessionPromise;

    sessionPromise = fetchWithTimeout(MCP_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json, text/event-stream'
      },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: callIdSeq++,
        method: 'initialize',
        params: {
          protocolVersion: '2024-11-05',
          capabilities: {},
          clientInfo: { name: 'tag-search-web', version: '1.0' }
        }
      })
    }).then(function (res) {
      if (!res.ok) throw new McpError('network', 'HTTP ' + res.status);
      var sid = res.headers.get('mcp-session-id');
      if (!sid) throw new McpError('session', 'SESSION_HEADER_MISSING');
      sessionId = sid;
      return sid;
    }).catch(function (err) {
      sessionPromise = null;
      throw err;
    });

    return sessionPromise.then(function (sid) {
      sessionPromise = null;
      return sid;
    });
  }

  function fetchWithTimeout(url, options) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, CALL_TIMEOUT_MS);
    options = options || {};
    options.signal = controller.signal;
    return fetch(url, options)
      .then(function (res) { clearTimeout(timer); return res; })
      .catch(function (err) {
        clearTimeout(timer);
        if (err && err.name === 'AbortError') throw new McpError('timeout', 'TIMEOUT');
        throw new McpError('network', String(err && err.message || err));
      });
  }

  function parseSse(rawText) {
    var payloads = rawText.split(/\r?\n/).filter(function (line) { return /^data:/.test(line); })
      .map(function (line) { return line.slice(5).trim(); }).filter(function (line) { return line !== '[DONE]'; });
    if (!payloads.length) payloads = [rawText];
    for (var i = 0; i < payloads.length; i++) {
      var envelope;
      try { envelope = JSON.parse(payloads[i]); } catch (e) { continue; }
      if (envelope.error) throw new McpError('rpc', envelope.error.message || 'RPC_ERROR');
      if (!envelope.result) continue;
      var result = envelope.result;
      if (result.isError) throw new McpError('rpc', '조회 도구가 오류를 반환했습니다.');
      var content = result.content && result.content[0];
      if (!content || typeof content.text !== 'string') throw new McpError('parse', 'EMPTY_RESPONSE');
      var data;
      try { data = JSON.parse(content.text); } catch (e) { throw new McpError('parse', 'INVALID_TOOL_JSON'); }
      if (!data || typeof data !== 'object') throw new McpError('parse', 'INVALID_TOOL_DATA');
      if (data.error) throw new McpError('rpc', String(data.error));
      return data;
    }
    throw new McpError('parse', 'NO_RESULT');
  }

  function isSessionError(res, err) {
    if (res && (res.status === 400 || res.status === 404)) return true;
    if (err instanceof McpError && err.kind === 'rpc') {
      var msg = (err.message || '') + '';
      if (/session/i.test(msg) || /mcp-session-id/i.test(msg)) return true;
      if (err.detail && err.detail.code === -32000) return true;
    }
    return false;
  }

  function callTool(name, args, _retried) {
    return ensureSession().then(function (sid) {
      return fetchWithTimeout(MCP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/event-stream',
          'mcp-session-id': sid
        },
        body: JSON.stringify({
          jsonrpc: '2.0',
          id: callIdSeq++,
          method: 'tools/call',
          params: { name: name, arguments: args }
        })
      }).then(function (res) {
        return res.text().then(function (raw) {
          if (!res.ok || /session/i.test(raw) && res.status >= 400) {
            if (isSessionError(res, null) && !_retried) {
              sessionId = null;
              return callTool(name, args, true);
            }
            throw new McpError('network', 'HTTP ' + res.status);
          }
          try {
            return parseSse(raw);
          } catch (err) {
            if (isSessionError(res, err) && !_retried) {
              sessionId = null;
              return callTool(name, args, true);
            }
            throw err;
          }
        });
      });
    });
  }

  // ======================================================================
  // §3 태그 정규화 / 변형 생성
  // ======================================================================
  function normalizeInput(raw) {
    return raw.trim().toUpperCase().replace(/\s+/g, '').replace(/[！-～]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    });
  }

  var TAG_RE = /^([56])?([A-Z]{2,3})-?([A-Z]{2,5}?)-?(\d{1,3})([A-Z]{0,2})$/;
  var BASE_TAG_RE = /^([56])?([A-Z]{2,3})-([A-Z]{2,5})$/;

  function parseTag(norm) {
    var m = TAG_RE.exec(norm);
    if (!m) return null;
    return { unit: m[1] || '', sys: m[2], type: m[3], num: m[4], sfx: m[5] || '' };
  }

  // 숫자 접미 없이 "계통-계기타입"만 입력된 경우 (예: MS-PT, CW-MV)
  function parseBaseTag(norm) {
    var m = BASE_TAG_RE.exec(norm);
    if (!m) return null;
    return { unit: m[1] || '', sys: m[2], type: m[3] };
  }



  function generateVariants(rawInput) {
    var norm = normalizeInput(rawInput);
    var parsed = parseTag(norm);
    if (!parsed) {
      return { parsed: null, variants: [norm], forLookup: norm };
    }
    var core = parsed.sys + '-' + parsed.type;
    var v1 = core + parsed.num + parsed.sfx;               // 하이픈 미삽입
    var v2 = core + '-' + parsed.num + parsed.sfx;          // 하이픈 삽입 ★핵심
    var list = [];
    var seen = {};
    function push(v) { if (v && !seen[v]) { seen[v] = true; list.push(v); } }
    push(v1);
    push(v2);
    push(norm);
    // lookup_tag에 던질 대표값: 유닛 접두가 있었으면 보존, 서버가 정규화한다고 명시돼 있음
    var forLookup = parsed.unit ? parsed.unit + v1 : v1;
    return { parsed: parsed, variants: list, forLookup: forLookup };
  }

  var FGD_SYS = { FG: 1, FD: 1, AB: 1, GG: 1, LS: 1, GY: 1, SD: 1, WW: 1, DE: 1, DS: 1 };

  function primaryLogicBook(parsed) {
    if (parsed && FGD_SYS[parsed.sys]) return 'FGD';
    return 'MAIN';
  }

  // ======================================================================
  // §4 검색 실행 — 병렬 + 단계적 확대
  // ======================================================================

  function runBaseTagScan(rawInput, base, offset) {
    var prefix = base.sys + '-' + base.type;
    return callTool('search_tags', { prefix: prefix, offset: offset || 0, limit: 100 }).then(function (data) {
      if (!Array.isArray(data.results)) throw new McpError('parse', 'INVALID_TAG_RESULTS');
      return { isBaseScan: true, rawInput: rawInput, prefix: data.prefix, total: data.total,
        nextOffset: data.next_offset, found: data.results.map(function (row) {
          return { tag: row.base_tag, instrument: row };
        }) };
    });
  }

  function runSearch(rawInput, renderCtx) {
    var gen = generateVariants(rawInput);

    var baseParsed = !gen.parsed ? parseBaseTag(normalizeInput(rawInput)) : null;
    if (baseParsed) {
      return runBaseTagScan(rawInput, baseParsed);
    }

    var primaryBook = primaryLogicBook(gen.parsed);
    var callLog = [];
    var startTs = Date.now();

    function logCall(desc) { callLog.push(desc + ' (' + (Date.now() - startTs) + 'ms)'); }

    var lookupPromise = callTool('lookup_tag', { tag: gen.forLookup })
      .then(function (data) { logCall('lookup_tag(' + gen.forLookup + ') OK'); return data; })
      .catch(function (err) { logCall('lookup_tag(' + gen.forLookup + ') FAIL: ' + err.message); return null; });

    // 로직해설서 자유검색 — 태그든 키워드("Governor Free" 등)든 입력 원문 그대로 병렬 조회.
    // 태그 검색 흐름과 완전히 독립적이라 실패해도 나머지 결과에 영향 없음.
    var manualSearchPromise = callTool('search_manual', { query: rawInput.trim() })
      .then(function (data) { logCall('search_manual(' + rawInput.trim() + ') -> ' + ((data.results || []).length) + '건'); return data; })
      .catch(function (err) { logCall('search_manual FAIL: ' + err.message); return null; });

    function searchLogicVariants(book, fallback) {
      return Promise.all(gen.variants.map(function (v) {
        var label = 'search_logic(' + v + ', ' + book + (fallback ? ', fallback' : '') + ')';
        return callTool('search_logic', { query: v, logic_book: book })
          .then(function (data) {
            logCall(label + ' -> ' + ((data.results || []).length) + '건');
            return { variant: v, book: book, data: data };
          })
          .catch(function (err) {
            logCall(label + ' FAIL: ' + err.message);
            return { variant: v, book: book, data: null, error: err };
          });
      }));
    }

    // 서버가 태그→시트 색인(body_mentions)을 주면 그걸 쓴다. search_logic은 시트 본문 전수
    // 스캔이라 변형마다 호출하면 D1 무료 읽기 한도를 빠르게 소진한다 — 색인이 없을 때만 폴백.
    return Promise.all([lookupPromise, manualSearchPromise]).then(function (res) {
      var lookupData = res[0];
      var manualData = res[1];
      if (lookupData && Array.isArray(lookupData.body_mentions)) {
        logCall('tag_sheet_index -> ' + lookupData.body_mentions.length + '건');
        var indexed = [{ variant: gen.forLookup, book: 'INDEX', data: { results: lookupData.body_mentions } }];
        return finalize(rawInput, gen, lookupData, indexed, callLog, manualData);
      }
      return searchLogicVariants(primaryBook, false).then(function (searchResults) {
        var anyLogicHit = searchResults.some(function (r) { return r.data && (r.data.results || []).length > 0; });
        var lookupHasUsages = lookupData && lookupData.usages_total > 0;
        if (!anyLogicHit && !lookupHasUsages && primaryBook === 'MAIN') {
          // 2단계 확대: FGD로 재시도
          return searchLogicVariants('FGD', true).then(function (fbResults) {
            return finalize(rawInput, gen, lookupData, searchResults.concat(fbResults), callLog, manualData);
          });
        }
        return finalize(rawInput, gen, lookupData, searchResults, callLog, manualData);
      });
    });
  }

  function finalize(rawInput, gen, lookupData, searchResults, callLog, manualData) {
    var failures = [];
    if (!lookupData) failures.push('태그·도면·계기 정보');
    if (!manualData) failures.push('로직해설서');
    searchResults.forEach(function (r) { if (!r.data && failures.indexOf('로직 검색') < 0) failures.push('로직 검색'); });
    if (lookupData && lookupData.warnings) failures = failures.concat(lookupData.warnings);
    if (!lookupData && !manualData && !searchResults.some(function (r) { return !!r.data; })) {
      throw new McpError('network', '모든 조회 요청이 실패했습니다.');
    }
    var merged = mergeLogicSheets(lookupData, searchResults);
    var drawings = mergeDrawings(lookupData);
    var manualSearch = (manualData && manualData.results) || [];
    return {
      failures: failures,
      rawInput: rawInput,
      gen: gen,
      lookup: lookupData,
      logicSheets: merged,
      drawings: drawings,
      manualSearch: manualSearch,
      callLog: callLog
    };
  }

  // ======================================================================
  // §5 결과 병합 / 중복제거 / 분류
  // ======================================================================
  function cleanStr(s) {
    if (s == null) return '';
    return String(s).replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function mergeLogicSheets(lookupData, searchResults) {
    var map = {};
    var order = [];

    function upsert(key, patch, source, variant) {
      var rec = map[key];
      if (!rec) {
        rec = { key: key, logic_book: patch.logic_book, drop_no: patch.drop_no, sheet_no: patch.sheet_no,
                 title: '', pdf_page: null, sources: {}, matchedVariants: {}, isSource: null };
        map[key] = rec;
        order.push(key);
      }
      if (!rec.title && patch.title) rec.title = patch.title;
      if (rec.pdf_page == null && patch.pdf_page != null) rec.pdf_page = patch.pdf_page;
      if (source) rec.sources[source] = true;
      if (variant) rec.matchedVariants[variant] = true;
      if (patch.isSource === 1) rec.isSource = 1;
      else if (patch.isSource === 0 && rec.isSource == null) rec.isSource = 0;
    }

    if (lookupData) {
      (lookupData.usages || []).forEach(function (u) {
        var key = u.logic_book + '|' + u.drop_no + '|' + u.sheet_no;
        upsert(key, { logic_book: u.logic_book, drop_no: u.drop_no, sheet_no: u.sheet_no, title: u.title, pdf_page: u.pdf_page, isSource: u.is_source }, 'usage', null);
      });
      (lookupData.sheets_with_tag_in_title || []).forEach(function (s) {
        var key = s.logic_book + '|' + s.drop_no + '|' + s.sheet_no;
        upsert(key, { logic_book: s.logic_book, drop_no: s.drop_no, sheet_no: s.sheet_no, title: s.title, pdf_page: s.pdf_page }, 'usage', null);
      });
    }

    searchResults.forEach(function (r) {
      if (!r.data || !r.data.results) return;
      r.data.results.forEach(function (s) {
        var key = s.logic_book + '|' + s.drop_no + '|' + s.sheet_no;
        upsert(key, { logic_book: s.logic_book, drop_no: s.drop_no, sheet_no: s.sheet_no, title: s.title, pdf_page: s.pdf_page }, 'search', r.variant);
      });
    });

    var list = order.map(function (k) { return map[k]; });
    list.forEach(function (rec) { rec.categories = classifySheet(rec.title); });

    var catRank = { trip: 0, interlock: 1, protection: 2, sequence: 3, annunciator: 4, control: 5 };
    function bestCatRank(rec) {
      var best = 99;
      rec.categories.forEach(function (c) { if (catRank[c] != null && catRank[c] < best) best = catRank[c]; });
      return best;
    }
    list.sort(function (a, b) {
      var ca = bestCatRank(a), cb = bestCatRank(b);
      if (ca !== cb) return ca - cb;
      var ua = a.sources.usage ? 0 : 1, ub = b.sources.usage ? 0 : 1;
      if (ua !== ub) return ua - ub;
      var sa = a.isSource === 1 ? 0 : 1, sb = b.isSource === 1 ? 0 : 1;
      if (sa !== sb) return sa - sb;
      if (a.logic_book !== b.logic_book) return a.logic_book === 'MAIN' ? -1 : 1;
      var da = parseInt(a.drop_no, 10) || 0, db = parseInt(b.drop_no, 10) || 0;
      if (da !== db) return da - db;
      return String(a.sheet_no).localeCompare(String(b.sheet_no), undefined, { numeric: true });
    });
    return list;
  }

  var CATEGORY_RULES = [
    ['trip', /\bTRIP\b|\bTRIPPING\b|\bMFT\b|EMERGENCY|SHUTDOWN|\bESD\b/],
    ['interlock', /INTERLOCK|\bILK\b|PERMISSIVE|PERMIT|\bLOCKOUT\b/],
    ['protection', /PROTECT|SAFETY|MECHANICAL TRIP|\bLIMIT\b/],
    ['annunciator', /ANNUNCIATOR|ANNUCIATOR|\bANN\b|ALARM|COUNTER/],
    ['sequence', /\bSQC\b|SEQUENCE|\bSTEP\b|AUTO\s*START|\bSTARTUP\b/],
    ['control', /CONTROL|MASTER|SETPOINT|\bPID\b|MODULAT/]
  ];

  function classifySheet(title) {
    if (!title) return [];
    var t = title.toUpperCase();
    var cats = [];
    CATEGORY_RULES.forEach(function (rule) {
      if (rule[1].test(t)) cats.push(rule[0]);
    });
    return cats;
  }

  function mergeDrawings(lookupData) {
    if (!lookupData) return [];
    var byNo = {};
    var order = [];
    function keyOf(no) { return cleanStr(no).replace(/\s+/g, '').toUpperCase(); }
    function upsert(no, title, tier, filePath, pdfPage, alias, docMeta) {
      no = cleanStr(no);
      if (!no) return;
      var k = keyOf(no);
      var rec = byNo[k];
      if (!rec) {
        rec = { dwg_no: no, title: cleanStr(title), tier: tier, file_path: filePath || null, pdf_page: pdfPage || null, doc_meta: docMeta || null };
        byNo[k] = rec;
        order.push(k);
      } else {
        if (tier < rec.tier) { rec.tier = tier; if (title) rec.title = cleanStr(title); }
        if (!rec.title && title) rec.title = cleanStr(title);
        // 같은 도면번호가 여러 티어에서 들어올 수 있다. 실물 경로는 먼저 발견된 것을 유지.
        if (!rec.file_path && filePath) { rec.file_path = filePath; rec.pdf_page = pdfPage || null; }
      }
      // doc_meta(stage 등)는 먼저 발견된 비어있지 않은 값을 유지
      if (rec.doc_meta == null && docMeta) rec.doc_meta = docMeta;
      // 공급사 번호로 적힌 같은 도면: KOSEP 번호 하나로 합치고 원래 번호는 별칭으로 남긴다
      if (alias && alias !== no) {
        rec.aliases = rec.aliases || [];
        if (rec.aliases.indexOf(alias) < 0) rec.aliases.push(alias);
      }
    }
    (lookupData.pinned_drawings || []).forEach(function (d) { upsert(d.dwg_no, d.title, 0, d.file_path, d.pdf_page, null, d.doc_meta); });
    (lookupData.field_instruments || []).forEach(function (fi) {
      if (!fi.pid_dwg_no) return;
      var pr = fi.pid_dwg_resolved;
      if (pr && pr.kosep_id) upsert(pr.kosep_id, pr.title || fi.service_desc, 1, pr.file_path, pr.pdf_page, fi.pid_dwg_no);
      else upsert(fi.pid_dwg_no, fi.service_desc, 1);
    });
    (lookupData.field_instruments || []).forEach(function (fi) {
      if (fi.vendor_dwg_resolved && fi.vendor_dwg_resolved.kosep_id) {
        upsert(fi.vendor_dwg_resolved.kosep_id, fi.vendor_dwg_resolved.title, 1.5, fi.vendor_dwg_resolved.file_path, fi.vendor_dwg_resolved.pdf_page);
      }
    });
    (lookupData.candidate_drawings || []).forEach(function (d) { upsert(d.dwg_no || d.kosep_id, d.title, 2, d.file_path, d.pdf_page, null, d.doc_meta); });
    return order.map(function (k) { return byNo[k]; });
  }

  // ======================================================================

  // ======================================================================
  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === 'class') node.className = props[k];
        else if (k === 'text') node.textContent = props[k];
        else if (k === 'html_TRUSTED_STATIC') node.innerHTML = props[k]; // 정적 아이콘 SVG 전용
        else if (k.indexOf('on') === 0 && typeof props[k] === 'function') node.addEventListener(k.slice(2), props[k]);
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

    var sk1 = el('div', { class: 'card skeleton-card' }, [
      el('div', { class: 'skeleton skeleton-line w60' }),
      el('div', { class: 'skeleton skeleton-line w40' })
    ]);
    var sk2 = el('div', { class: 'card skeleton-card' }, [
      el('div', { class: 'skeleton skeleton-line w80' }),
      el('div', { class: 'skeleton skeleton-line w60' }),
      el('div', { class: 'skeleton skeleton-line w40' })
    ]);
    results.appendChild(sk1);
    results.appendChild(sk2);
  }

  function renderError(err, tag) {
    clear(results);
    var msg = '알 수 없는 오류가 발생했습니다.';
    if (err instanceof McpError) {
      if (err.kind === 'timeout') msg = '응답이 지연되고 있습니다. 다시 시도해 주세요.';
      else if (err.kind === 'network') msg = '네트워크에 연결할 수 없습니다. 통신 상태를 확인해 주세요.';
      else if (err.kind === 'session') msg = '서버 연결이 만료되었습니다. 다시 검색해 주세요.';
      else if (err.kind === 'parse') msg = '응답을 해석하지 못했습니다.';
      else if (err.kind === 'rpc') msg = '서버에서 오류를 반환했습니다: ' + err.message;
    }
    var block = el('div', { class: 'card state-block' }, [
      el('div', { class: 'state-title', text: '조회 실패' }),
      el('div', { class: 'state-desc', text: msg }),
      el('button', { class: 'retry-btn', type: 'button', onclick: function () { doSearch(tag); } }, ['다시 시도'])
    ]);
    results.appendChild(block);
  }

  function renderEmpty(tag, gen) {
    clear(results);
    var block = el('div', { class: 'card state-block' }, [
      el('div', { class: 'state-title', text: '"' + tag + '" 태그를 찾지 못했습니다' }),
      el('div', { class: 'state-desc', text: '태그 표기(하이픈 위치, 유닛 접두 등)가 다를 수 있습니다. 아래는 실제로 시도한 형태입니다.' }),
      el('div', { class: 'variant-tried' }, gen.variants.map(function (v) { return el('span', { text: v }); }))
    ]);
    results.appendChild(block);
  }

  function renderBaseScan(result) {
    clear(results);
    if (!result.found.length) {
      var block = el('div', { class: 'card state-block' }, [
        el('div', { class: 'state-title', text: '"' + result.prefix + '"로 시작하는 태그를 찾지 못했습니다' }),
        el('div', { class: 'state-desc', text: '현재 계기·신호·도면 태그 색인에 일치하는 태그가 없습니다. 접두어 표기를 확인해 주세요.' })
      ]);
      results.appendChild(block);
      return;
    }

    var intro = el('div', { class: 'card card-pad' }, [
      el('p', { class: 'summary-tag', text: result.prefix }),
      el('p', { class: 'summary-desc', text: '색인에서 전체 ' + result.total + '건을 찾았습니다. 현재 ' + result.found.length + '건 표시 중입니다. 원하는 태그를 선택하세요.' })
    ]);
    results.appendChild(intro);

    var items = result.found.map(function (f) {
      var fi = f.instrument;
      var item = el('div', { class: 'logic-item' }, [
        el('div', { class: 'logic-sheet-no', text: f.tag.slice(-2) }),
        el('div', { class: 'logic-body' }, [
          el('div', { class: 'logic-title', text: f.tag + (fi && fi.service_desc ? ' — ' + cleanStr(fi.service_desc) : '') }),
          fi && fi.maker ? el('div', { class: 'logic-page', text: cleanStr(fi.maker) + (fi.model_no ? ' · ' + fi.model_no : '') }) : null
        ])
      ]);
      item.style.cursor = 'pointer';
      item.addEventListener('click', function () {
        searchInput.value = f.tag;
        doSearch(f.tag);
      });
      return item;
    });
    var listCard = el('div', {}, [
      el('div', { class: 'section-title', text: '존재하는 태그 (' + result.found.length + '건, 탭하여 상세 조회)' }),
      el('div', { class: 'card logic-list' }, items)
    ]);
    results.appendChild(listCard);
    if (result.nextOffset != null) {
      var more = el('button', { class: 'retry-btn', type: 'button', text: '태그 더 보기', onclick: function () {
        more.disabled = true;
        var token = currentToken;
        runBaseTagScan(result.rawInput, parseBaseTag(normalizeInput(result.prefix)), result.nextOffset).then(function (next) {
          if (token !== currentToken) return;
          next.found = result.found.concat(next.found);
          renderBaseScan(next);
        }).catch(function () {
          if (token !== currentToken) return;
          more.textContent = '추가 조회 실패 · 다시 시도'; more.disabled = false;
        });
      } });
      results.appendChild(more);
    }
  }

  function renderPartial(result) {
    var failures = result.failures || [];
    if (!failures.length) return;
    results.appendChild(el('div', { class: 'card card-pad', role: 'status' }, [
      el('strong', { text: '일부 조회 실패' }),
      el('p', { text: failures.join(' · ') + ' 정보를 확인하지 못했습니다. 검색 결과가 누락되어 있을 수 있습니다.' }),
      el('button', { class: 'retry-btn', type: 'button', onclick: function () { doSearch(result.rawInput); } }, ['다시 시도'])
    ]));
  }

  function logicPageUrl(sheet) {
    var files = { MAIN: 'LOGIC_Main_20240319.pdf', FGD: 'LOGIC_FGD_20240319.pdf' };
    if (!files[sheet.logic_book] || !Number.isInteger(sheet.pdf_page) || sheet.pdf_page < 1) return null;
    return drawingUrl('001 계측제어/01 TBN/003 Software/02 Control/' + files[sheet.logic_book]) + '#page=' + sheet.pdf_page;
  }

  function renderResults(result) {
    if (result.isBaseScan) { renderBaseScan(result); return; }
    clear(results);
    var lookup = result.lookup;
    var instruments = (lookup && lookup.field_instruments) || [];
    var setpoints = (lookup && lookup.setpoints) || [];
    var provenance = (lookup && lookup.instrument_provenance) || [];
    var manualMentions = (lookup && lookup.manual_mentions) || [];
    var relatedDrawings = (lookup && lookup.related_drawings) || {};
    var tagNote = lookup && lookup.tag_note && cleanStr(lookup.tag_note.note) ? lookup.tag_note : null;
    var tagAuto = lookup && lookup.tag_auto && typeof lookup.tag_auto === 'object' ? lookup.tag_auto : null;
    var valueConflicts = (lookup && Array.isArray(lookup.value_conflicts)) ? lookup.value_conflicts : [];
    var logicSheets = result.logicSheets;
    var drawings = result.drawings;
    var manualSearch = result.manualSearch || [];

    var hasAnything = instruments.length || setpoints.length || logicSheets.length || drawings.length ||
      manualMentions.length || manualSearch.length || Object.keys(relatedDrawings).length ||
      tagNote || tagAuto || valueConflicts.length;

    if (!hasAnything && (result.failures || []).length) { renderPartial(result); return; }
    if (!hasAnything) {
      renderEmpty(result.rawInput, result.gen);
      return;
    }

    renderPartial(result);
    var tripSheets = logicSheets.filter(function (s) { return s.categories.indexOf('trip') !== -1 || s.categories.indexOf('interlock') !== -1; });

    // ① 요약 카드
    var primaryDesc = instruments.length ? cleanStr(instruments[0].service_desc) : '';
    var summaryBadges = [];
    if (tripSheets.length) summaryBadges.push(badge('trip', null));
    var catSeen = {};
    logicSheets.forEach(function (s) { s.categories.forEach(function (c) { catSeen[c] = true; }); });
    ['interlock', 'protection'].forEach(function (c) { if (catSeen[c] && !summaryBadges.length) summaryBadges.push(badge(c)); });

    var summaryCard = el('div', { class: 'card card-pad' }, [
      el('p', { class: 'summary-tag', text: result.rawInput.trim().toUpperCase() }),
      primaryDesc ? el('p', { class: 'summary-desc', text: primaryDesc }) : null,
      summaryBadges.length ? el('div', { class: 'summary-badges' }, summaryBadges) : null
    ]);
    results.appendChild(summaryCard);
    if (tagNote) results.appendChild(buildTagNote(tagNote));
    if (tagAuto) results.appendChild(buildTagAuto(tagAuto, !!tagNote));

    // ② P&ID 도면번호
    if (drawings.length) {
      var pidItems = drawings.map(function (d) {
        var copyBtn = el('button', { class: 'pid-copy', type: 'button' }, ['복사']);
        copyBtn.addEventListener('click', function () {
          copyToClipboard(d.dwg_no);
          copyBtn.textContent = '복사됨';
          copyBtn.classList.add('copied');
          setTimeout(function () { copyBtn.textContent = '복사'; copyBtn.classList.remove('copied'); }, 1400);
        });
        // 실물 파일이 없으면(file_path null) 링크를 만들지 않는다 — 번호만 맞고
        // 파일이 없는 경우가 많아(계장루프배선도 등) 깨진 링크가 되기 때문.
        var openUrl = drawingUrl(d.file_path);
        if (openUrl && d.pdf_page) openUrl += '#page=' + d.pdf_page;
        var aliasNote = (d.aliases && d.aliases.length)
          ? el('span', { class: 'dwg-alias', text: ' (= ' + d.aliases.map(function (a) { return supplierLabel(a) + ' ' + a; }).join(', ') + ')' })
          : null;
        return el('div', { class: 'pid-item' }, [
          el('div', { class: 'pid-number-row' }, [
            el('div', { class: 'pid-number' }, [d.dwg_no, aliasNote, stageBadge(d.doc_meta)]),
            openUrl ? el('a', { class: 'pid-open', href: openUrl, target: '_blank', rel: 'noopener' }, ['열기']) : null,
            copyBtn
          ]),
          d.title ? el('div', { class: 'pid-title', text: d.title }) : null,
          el('div', { class: 'pid-confidence', text: TIER_LABEL[d.tier] || '' })
        ]);
      });
      var pidSection = el('div', {}, [
        el('div', { class: 'section-title', text: 'P&ID 도면 · 전체 ' + drawings.length + '건' }),
        el('div', { class: 'card pid-block' }, pidItems)
      ]);
      if (pidItems.length > 6) {
        pidItems.slice(6).forEach(function (item) { item.hidden = true; });
        var moreDrawings = el('button', { class: 'retry-btn', type: 'button', text: '나머지 ' + (pidItems.length - 6) + '건 더 보기', onclick: function () {
          pidItems.forEach(function (item) { item.hidden = false; });
          moreDrawings.hidden = true;
        } });
        pidSection.appendChild(moreDrawings);
      }
      pidSection.appendChild(buildDwgGuide());
      results.appendChild(pidSection);
    }

    // ③ 트립·인터록 배너
    if (tripSheets.length) {
      var iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
      var banner = el('div', { class: 'banner' }, [
        el('span', { html_TRUSTED_STATIC: iconSvg }),
        el('span', {}, [
          el('strong', { text: '트립·인터록 관련으로 보이는 시트가 ' + tripSheets.length + '건 있습니다. ' }),
          '실제 트립 발생 여부는 해당 로직 시트를 직접 확인하세요. (제목 키워드 기반 자동 분류이며 근거로 삼기에 충분하지 않을 수 있습니다.)'
        ])
      ]);
      results.appendChild(banner);
    } else if (logicSheets.length) {
      var note = el('div', { class: 'banner' }, [
        el('span', {}, ['제목 기준으로는 트립 관련 시트가 확인되지 않았습니다. 본문에 포함되어 있을 수 있습니다.'])
      ]);
      note.style.background = 'var(--bg-sunken)';
      note.style.color = 'var(--fg-muted)';
      results.appendChild(note);
    }

    // ④ 로직 사용처
    if (logicSheets.length) {
      var logicItems = logicSheets.map(function (s, idx) {
        var isTrip = s.categories.indexOf('trip') !== -1;
        var sourceBadge = s.sources.usage
          ? el('span', { class: 'badge badge-confirmed', text: '신호 연결' })
          : el('span', { class: 'badge badge-mentioned', text: '본문 언급' });
        var metaRow = el('div', { class: 'logic-meta' }, s.categories.map(function (c) { return badge(c); }).concat([sourceBadge]));
        return el('div', { class: 'logic-item' + (isTrip ? ' is-trip' : '') + (idx === 0 ? ' is-first-item' : '') }, [
          el('div', { class: 'logic-sheet-no', text: s.drop_no + '/' + s.sheet_no }),
          el('div', { class: 'logic-body' }, [
            el('div', { class: 'logic-title', text: s.title || '(제목 없음)' }),
            metaRow,
            logicPageUrl(s) ? el('a', { class: 'pid-open', href: logicPageUrl(s), target: '_blank', rel: 'noopener', text: '원본 p.' + s.pdf_page + ' 열기' }) : null,
            s.pdf_page != null ? el('div', { class: 'logic-page', text: '도면집 p.' + s.pdf_page + ' · ' + s.logic_book }) : el('div', { class: 'logic-page', text: s.logic_book })
          ])
        ]);
      });
      var logicSection = el('div', {}, [
        el('div', { class: 'section-title', text: '로직 사용처 (' + logicSheets.length + '건)' }),
        el('div', { class: 'card logic-list' }, logicItems)
      ]);
      results.appendChild(logicSection);
    }

    // ⑤ 현장계기 정보 — 값마다 어느 문서에서 왔는지 같이 보여 준다
    function docLink(filePath, page, label) {
      var u = drawingUrl(filePath);
      if (!u) return label;
      return el('a', { href: u + (page ? '#page=' + page : ''), target: '_blank', rel: 'noopener', text: label });
    }
    var SOURCE_LABEL = {
      'BOP-INDEX': '★BOP 계기 엑셀',
      'TG-462-001': '준공 계기 리스트 L-30000-LJ-462-001',
      'WT-LIST': '수처리 계기 엑셀 (원본 파일 위치 미확인)'
    };
    if (instruments.length || setpoints.length) {
      var instBlocks = instruments.map(function (fi, idx) {
        var rows = [];
        function row(label, val) {
          val = cleanStr(val);
          if (!val) return;
          rows.push(el('div', { class: 'kv-row' }, [
            el('dt', { text: label }),
            el('dd', { text: val })
          ]));
        }
        function rowEl(label, children) {
          rows.push(el('div', { class: 'kv-row' }, [el('dt', { text: label }), el('dd', {}, children)]));
        }
        row('제조사', fi.maker);
        row('모델', fi.model_no);
        row('레인지', fi.signal_range ? fi.signal_range + (fi.eng_unit ? ' ' + fi.eng_unit : '') : '');
        row('설정치', fi.set_point);
        row('위치', fi.location);
        row('공급사', fi.supplier);
        row('비고', fi.remarks);
        if (fi.pid_dwg_resolved && fi.pid_dwg_resolved.kosep_id && cleanStr(fi.pid_dwg_no) &&
            fi.pid_dwg_resolved.kosep_id !== cleanStr(fi.pid_dwg_no)) {
          row('계기 배치도 번호(참고용)', cleanStr(fi.pid_dwg_no) + ' → ' + fi.pid_dwg_resolved.kosep_id +
            ' (같은 도면, ' + supplierLabel(cleanStr(fi.pid_dwg_no)) + ')');
        } else {
          row('계기 배치도 번호(참고용)', fi.pid_dwg_no);
        }
        if (fi.vendor_dwg_resolved) {
          var vdr = fi.vendor_dwg_resolved;
          var vdrText = vdr.kosep_id + (vdr.title ? ' — ' + cleanStr(vdr.title) : '') + ' ';
          var vdrUrl = drawingUrl(vdr.file_path);
          if (vdrUrl) {
            if (vdr.pdf_page) vdrUrl += '#page=' + vdr.pdf_page;
            rowEl('제작사(OEM) 설치도면', [vdrText, el('a', { class: 'pid-open', href: vdrUrl, target: '_blank', rel: 'noopener', text: '열기' })]);
          } else {
            row('제작사(OEM) 설치도면', vdrText + (vdr.file_path ? '[열람 가능]' : '[목록만 확인됨, 실물 미변환]'));
          }
        }
        var srcLabel = SOURCE_LABEL[fi.source_doc] || cleanStr(fi.source_doc);
        var pv = fi.source_doc === 'BOP-INDEX' ? provenance[0] : null;
        if (pv && pv.status === 'matches') {
          rowEl('출처', [srcLabel + ' · 공식 인덱스 ', docLink(pv.file_path, pv.pdf_page, pv.doc_no + (pv.pdf_page ? ' p.' + pv.pdf_page : '')), '와 일치']);
        } else if (pv && pv.status === 'differs') {
          rowEl('출처', [srcLabel + ' · 공식 인덱스 ', docLink(pv.file_path, pv.pdf_page, pv.doc_no + (pv.pdf_page ? ' p.' + pv.pdf_page : '')), '와 다름 — ' + cleanStr(pv.diff_note)]);
        } else if (pv && pv.status === 'not_in_official') {
          row('출처', srcLabel + ' · 공식 인덱스(' + pv.doc_no + ')에 없는 태그');
        } else if (srcLabel) {
          row('출처', srcLabel);
        }
        return el('div', { class: 'instrument-block' }, [
          instruments.length > 1 ? el('div', { class: 'instrument-heading', text: (idx + 1) + '. ' + cleanStr(fi.raw_tag || fi.instr_type) }) : null,
          el('dl', { class: 'kv-list' }, rows)
        ]);
      });
      // 공식 세팅치 리스트(문서번호·리비전·원본 쪽)
      setpoints.forEach(function (sp) {
        var rows = [];
        function add(label, children) {
          rows.push(el('div', { class: 'kv-row' }, [el('dt', { text: label }), el('dd', {}, children)]));
        }
        if (cleanStr(sp.set_point)) add('세팅치', [cleanStr(sp.set_point) + (sp.unit ? ' ' + cleanStr(sp.unit) : '')]);
        if (cleanStr(sp.cal_range)) add('교정 레인지', [cleanStr(sp.cal_range)]);
        if (cleanStr(sp.loop_sheet)) add('기능루프도', [cleanStr(sp.loop_sheet)]);
        add('출처', [docLink(sp.file_path, sp.pdf_page, sp.doc_no + ' Rev ' + sp.doc_rev + (sp.pdf_page ? ' p.' + sp.pdf_page : ''))]);
        if (sp.needs_check) add('주의', ['표에서 줄바꿈된 칸을 이어 붙인 값 — 원본 쪽에서 확인하세요']);
        instBlocks.push(el('div', { class: 'instrument-block' }, [
          el('div', { class: 'instrument-heading', text: '공식 세팅치 · ' + cleanStr(sp.raw_tag) + (sp.service_desc ? ' — ' + cleanStr(sp.service_desc) : '') }),
          el('dl', { class: 'kv-list' }, rows)
        ]));
      });
      var instSection = el('div', {}, [
        el('div', { class: 'section-title', text: '현장계기 정보' }),
        el('div', { class: 'card' }, instBlocks)
      ]);
      results.appendChild(instSection);
    }
    if (valueConflicts.length) results.appendChild(buildConflicts(valueConflicts));

    // ⑥ 관련 도면 (접힘)
    var relGroups = Object.keys(relatedDrawings);
    var relHasFile = false;
    if (relGroups.length) {
      var relBody = relGroups.map(function (groupName) {
        var items = relatedDrawings[groupName].map(function (d) {
          // 묶음 PDF(ILWD 합본 등)면 pdf_page로 해당 쪽을 바로 연다
          var relUrl = drawingUrl(d.file_path);
          if (relUrl && d.pdf_page) relUrl += '#page=' + d.pdf_page;
          if (relUrl) relHasFile = true;
          return el('div', { class: 'related-item' }, [
            el('div', { class: 'pid-number-row' }, [
              el('div', { class: 'related-dwg' }, [cleanStr(d.kosep_id || d.dwg_no), stageBadge(d.doc_meta)]),
              relUrl ? el('a', { class: 'pid-open', href: relUrl, target: '_blank', rel: 'noopener',
                text: d.pdf_page ? '열기 (합본 p.' + d.pdf_page + ')' : '열기' }) : null
            ]),
            el('div', { class: 'related-title', text: cleanStr(d.title) })
          ]);
        });
        return el('div', { class: 'related-group' }, [
          el('div', { class: 'related-group-title', text: groupName }),
          el('div', {}, items)
        ]);
      });
      // 열 수 있는 도면이 있으면 펼친 상태로 보여 준다
      var relDetails = el('details', relHasFile ? { class: 'card', open: '' } : { class: 'card' }, [
        el('summary', {}, [
          el('span', { text: '관련 도면' }),
          el('span', { class: 'count', text: relGroups.length + '종' })
        ]),
        el('div', { class: 'details-body no-pad-top' }, relBody)
      ]);
      results.appendChild(relDetails);
    }

    // ⑦ 해설서 언급 (접힘)
    if (manualMentions.length) {
      var mmItems = manualMentions.map(function (m) {
        return el('div', { class: 'manual-item' }, [
          el('span', { class: 'manual-page', text: 'p.' + m.page + '  ' }),
          cleanStr(m.heading)
        ]);
      });
      var mmDetails = el('details', { class: 'card' }, [
        el('summary', {}, [
          el('span', { text: '해설서 언급' }),
          el('span', { class: 'count', text: manualMentions.length + '건' })
        ]),
        el('div', { class: 'details-body no-pad-top' }, mmItems)
      ]);
      results.appendChild(mmDetails);
    }

    // ⑦-2 로직해설서 검색결과 (자유 검색어 기반, search_manual)
    if (manualSearch.length) {
      var msItems = manualSearch.map(function (m) {
        return el('div', { class: 'manual-item' }, [
          el('span', { class: 'manual-page', text: 'p.' + m.page + '  ' }),
          cleanStr(m.heading),
          m.excerpt ? el('div', { class: 'manual-excerpt', text: cleanStr(m.excerpt) }) : null
        ]);
      });
      var msDetails = el('details', { class: 'card', open: 'true' }, [
        el('summary', {}, [
          el('span', { text: '로직해설서 검색결과' }),
          el('span', { class: 'count', text: manualSearch.length + '건' })
        ]),
        el('div', { class: 'details-body no-pad-top' }, msItems)
      ]);
      results.appendChild(msDetails);
    }

    // ⑧ 진단 정보 (접힘)
    var diagDetails = el('details', { class: 'card' }, [
      el('summary', {}, [
        el('span', { text: '진단 정보' }),
        el('span', { class: 'count', text: '시도한 검색' })
      ]),
      el('div', { class: 'details-body no-pad-top' }, [
        el('div', { class: 'variant-tried', style: 'justify-content:flex-start;margin-top:0' }, result.gen.variants.map(function (v) { return el('span', { text: v }); })),
        el('div', { style: 'margin-top:10px' }, result.callLog.map(function (line) { return el('div', { class: 'diag-line', text: line }); }))
      ])
    ]);
    results.appendChild(diagDetails);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ======================================================================
  // §7 상태 / 최근검색 / 테마 / 라우팅
  // ======================================================================
  function getRecent() {
    try {
      var raw = localStorage.getItem(RECENT_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function pushRecent(tag) {
    try {
      var list = getRecent().filter(function (t) { return t !== tag; });
      list.unshift(tag);
      list = list.slice(0, 8);
      localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  var currentToken = 0;
  function doSearch(tag) {
    tag = (tag || '').trim();
    if (!tag) { ++currentToken; searchBtn.disabled = false; renderIntro(); return; }
    var token = ++currentToken;
    searchBtn.disabled = true;
    renderLoading(tag);
    location.hash = '#tag=' + encodeURIComponent(tag);
    runSearch(tag).then(function (result) {
      if (token !== currentToken) return;
      pushRecent(tag.trim().toUpperCase());
      renderResults(result);
    }).catch(function (err) {
      if (token !== currentToken) return;
      renderError(err, tag);
    }).then(function () {
      if (token === currentToken) searchBtn.disabled = false;
    });
  }

  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(searchInput.value);
  });

  // 테마 토글
  var themeToggle = document.getElementById('themeToggle');
  var iconSun = document.getElementById('themeIconSun');
  var iconMoon = document.getElementById('themeIconMoon');
  function currentTheme() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr) return attr;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncThemeIcon() {
    var t = currentTheme();
    iconSun.style.display = t === 'dark' ? '' : 'none';
    iconMoon.style.display = t === 'dark' ? 'none' : '';
  }
  themeToggle.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    syncThemeIcon();
  });
  syncThemeIcon();

  // 초기 로드: 해시 라우팅
  function initFromHash() {
    var m = /#tag=([^&]+)/.exec(location.hash);
    if (m) {
      var tag = decodeURIComponent(m[1]);
      searchInput.value = tag;
      doSearch(tag);
    } else {
      renderIntro();
    }
  }
  initFromHash();
  }
})();
</script>
