<meta charset="utf-8">
<title>설비 태그 검색</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<script>
(function () {
  try {
    var saved = localStorage.getItem('tagsearch-theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
<style>
/* Existing renderer components; visual theme overrides follow. */



  @media (prefers-color-scheme: dark) {

  }





  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent-soft-bg); color: var(--accent-soft-fg); }

  a { color: var(--accent); }

  button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
  }
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- header / search ---- */

    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);

    flex-direction: column;
    gap: 0;
    align-items: stretch;
  }
  .topbar-right {
    position: absolute;
    top: 10px;
    right: 14px;
  }
  /* ── Tab navigation ── */
  .app-tabs {
    display: flex;
    gap: 0;
    margin: 0 0 -1px;
  }
  .app-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .app-tab:hover { color: var(--fg); }
  .app-tab--active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  /* ── Catalog toolbar ── */
  .catalog-toolbar {
    padding: 10px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .catalog-filters {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-right: 2px;
  }
  .catalog-filter {
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    color: var(--fg);
  }
  .catalog-filter--active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .catalog-search-form {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .catalog-search-form input {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 5px 10px;
    font-size: 0.85rem;
    color: var(--fg);
  }
  .catalog-search-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 5px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  /* ── Catalog note (provenance) ── */
  .catalog-note {
    padding: 4px 14px 6px;
    background: var(--bg);
  }
  .discipline-note {
    font-size: 0.72rem;
    color: var(--muted);
  }
  /* ── Catalog results ── */
  .catalog-results {
    padding: 8px 14px;
  }
  .catalog-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .catalog-row:last-child { border-bottom: none; }
  .catalog-row-top {

    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .catalog-kosep {
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 600;

  }
  .catalog-title {

  .catalog-row-meta {

    gap: 8px;
    font-size: 0.74rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .catalog-discipline {

    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 0.72rem;
  }
  .catalog-has-file {
    color: var(--ok, #3c8);
    font-size: 0.72rem;
  }
  /* Auxiliary catalog source button */
  .catalog-source-btn {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--fg-muted);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .catalog-source-btn--active {
    background: var(--accent, #3b82f6);
    color: #fff;
    border-color: transparent;
  }
  .aux-badge {
    display: inline-block;
    font-size: 0.65rem;
    background: var(--warn-bg, #783);
    color: #fff;
    border-radius: 3px;
    padding: 1px 4px;
    margin-left: 2px;
    white-space: nowrap;
  }
  .catalog-aux-source {
    font-size: 0.68rem;
    color: var(--fg-muted);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .catalog-aux-source span { margin-right: 6px; }
  .catalog-pager {
    padding: 8px 14px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: flex-end;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .catalog-pager button {
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 3px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--fg);
  }
  .catalog-pager button:disabled { opacity: 0.4; cursor: default; }
  .catalog-status {
    padding: 20px 14px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  .search-form {
    flex: 1;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 4px 4px 4px 12px;
    box-shadow: var(--shadow);
  }
  .search-form:focus-within { border-color: var(--focus); }
  .search-form input[type="search"] {

    border: none;
    background: transparent;
    color: var(--fg);
    font-family: var(--font-mono);

  .search-form button[type="submit"] {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 7px;
    padding: 0 16px;
    height: 40px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .search-form button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  .theme-toggle {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: var(--bg-raised);
    color: var(--fg-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle svg { width: 18px; height: 18px; }

  main { flex: 1; padding: 14px 14px 48px; display: flex; flex-direction: column; gap: 14px; }

  /* ---- intro / chips ---- */
  .intro { padding: 24px 4px 4px; }
  .intro h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .intro p { margin: 0; color: var(--fg-muted); font-size: 14px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    border-radius: 999px;
    padding: 7px 13px;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--fg); }
  .chip-label { font-size: 12px; color: var(--fg-faint); margin: 18px 0 0; text-transform: uppercase; letter-spacing: 0.06em; }

  /* ---- cards / sections ---- */
  .card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-pad { padding: 16px; }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-faint);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* summary card */
  .summary-tag {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .summary-desc { color: var(--fg-muted); font-size: 14px; margin: 4px 0 0; }
  .summary-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    line-height: 1.6;
    white-space: nowrap;
  }
  .badge-trip { background: var(--trip-bg); color: var(--trip-fg); }
  .badge-interlock { background: var(--interlock-bg); color: var(--interlock-fg); }
  .badge-protection { background: var(--protection-bg); color: var(--protection-fg); }
  .badge-annunciator { background: var(--annunciator-bg); color: var(--annunciator-fg); }
  .badge-sequence { background: var(--sequence-bg); color: var(--sequence-fg); }
  .badge-control { background: var(--control-bg); color: var(--control-fg); }
  .badge-confirmed { background: var(--confirmed-bg); color: var(--confirmed-fg); }
  .badge-mentioned { background: var(--mentioned-bg); color: var(--mentioned-fg); }

  /* P&ID drawing block */
  .pid-block { padding: 16px; }
  .pid-item + .pid-item { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .pid-number-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pid-number {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.01em;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .pid-copy {
    flex-shrink: 0;
    border: 1px solid var(--border-strong);
    background: var(--bg-sunken);
    color: var(--fg-muted);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    min-height: 36px;
  }
  .pid-copy.copied { background: var(--confirmed-bg); color: var(--confirmed-fg); border-color: transparent; }
  .pid-open {
    flex-shrink: 0;
    border: 1px solid transparent;
    background: var(--confirmed-bg);
    color: var(--confirmed-fg);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .pid-title { font-size: 13px; color: var(--fg-muted); margin-top: 4px; }
  .pid-confidence { font-size: 11px; color: var(--fg-faint); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
  /* discipline group header inside pid-block */
  .dwg-disc-header {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 14px 0 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  .dwg-disc-header:first-child { margin-top: 0; }
  .dwg-disc-est {
    font-weight: 400;
    font-style: italic;
    color: var(--fg-faint);
    text-transform: none;
    letter-spacing: 0;
  }

  /* trip banner */
  .banner {
    display: flex;
    gap: 10px;
    padding: 13px 14px;
    border-radius: var(--radius);
    background: var(--trip-bg);
    color: var(--trip-fg);
    font-size: 13.5px;
    line-height: 1.55;
    border: 1px solid transparent;
  }
  .banner svg { flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; }
  .banner strong { font-weight: 700; }

  /* answer card — 결과 최상단 요약 */
  .answer-card { padding: 14px 16px; margin-bottom: 12px; }
  .answer-tag { font-family: var(--font-mono); font-size: 22px; font-weight: 700; word-break: break-all; margin: 0; line-height: 1.3; }
  .answer-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--fg-muted); }
  .answer-line { margin: 10px 0 0; padding: 9px 11px; border-radius: 8px; border: 1px solid transparent; font-size: 13.5px; line-height: 1.5; }
  .answer-line .answer-label { display: block; font-size: 11px; font-weight: 600; color: var(--fg-muted); margin-bottom: 2px; }
  .answer-line a.answer-jump { font-weight: 600; font-size: 12.5px; margin-left: 6px; white-space: nowrap; }
  .answer-line.is-trip { background: var(--trip-bg); color: var(--trip-fg); border-left: 4px solid var(--trip-stripe); }
  .answer-line.is-trip .answer-label { color: var(--trip-fg); }
  .answer-line.is-logic { background: var(--interlock-bg); color: var(--interlock-fg); border-left: 4px solid var(--interlock-fg); }
  .answer-line.is-logic .answer-label { color: var(--interlock-fg); }
  .answer-line.is-none, .answer-line.is-missing { background: transparent; color: var(--fg-muted); border: 1px dashed var(--border-strong); }
  .answer-line.is-plain { background: var(--bg-sunken); color: var(--fg); }
  .answer-pid { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .answer-pid .pid-number { font-family: var(--font-mono); font-weight: 600; word-break: break-all; flex: 1 1 140px; }
  .answer-caveat { margin: 10px 0 0; font-size: 12px; line-height: 1.55; color: var(--fg-muted); }
  .ledger-none { margin: 8px 0 0; font-size: 12.5px; color: var(--fg-muted); }

  /* logic list */
  .logic-list { display: flex; flex-direction: column; }
  .logic-item {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    position: relative;
  }
  .logic-item:first-child { border-top: none; }
  .logic-item.is-trip { border-left: 3px solid var(--trip-stripe); }
  .logic-item.is-trip:not(.is-first-item) { margin-top: -1px; }
  .logic-sheet-no {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--fg-muted);
    flex-shrink: 0;

    padding-top: 1px;

  .logic-body { flex: 1; min-width: 0; }
  .logic-title { font-size: 14px; font-weight: 500; word-break: keep-all; }
  .logic-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .logic-page { font-size: 11.5px; color: var(--fg-faint); margin-top: 4px; }

  /* instrument dl */
  .kv-list { display: flex; flex-direction: column; }
  .kv-row {
    display: flex;
    gap: 14px;
    padding: 9px 16px;
    border-top: 1px solid var(--border);
    font-size: 13.5px;
  }
  .kv-row:first-child { border-top: none; }
  .kv-row dt { color: var(--fg-faint); flex: 0 0 88px; font-size: 12.5px; padding-top: 1px; }
  .kv-row dd { margin: 0; flex: 1; font-family: var(--font-mono); word-break: break-word; }
  .instrument-block + .instrument-block { border-top: 1px solid var(--border); }
  .instrument-heading {
    padding: 10px 16px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--fg);
  }

  /* collapsible sections */
  details.card { padding: 0; }
  details > summary {

    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-faint);
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { transition: transform 0.15s ease; flex-shrink: 0; }
  details[open] > summary .chev { transform: rotate(90deg); }
  details > summary .count { font-family: var(--font-mono); color: var(--fg-muted); font-weight: 400; text-transform: none; letter-spacing: normal; }
  details > .details-body { padding: 0 16px 16px; }
  details > .details-body.no-pad-top { padding-top: 0; }

  .stage-pill { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.5; padding: 0 7px; margin-left: 6px; border-radius: 999px; background: var(--accent-soft-bg); color: var(--accent-soft-fg); font-family: var(--font-ui); vertical-align: middle; }
  .tag-note-text { white-space: pre-wrap; margin: 6px 0 0; font-size: 14px; line-height: 1.6; }
  .tag-note-src { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--fg-muted); }
  .auto-muted { font-size: 12px; color: var(--fg-muted); margin: 6px 0 0; }
  .auto-line { font-size: 13.5px; line-height: 1.6; margin: 8px 0 0; }
  .auto-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 0; }

  .auto-trip { background: var(--trip-bg); color: var(--trip-fg); border-left: 3px solid var(--trip-stripe); border-radius: 6px; padding: 10px 12px; margin: 10px 0 0; }

  .auto-trip-basis { font-size: 11.5px; opacity: .8; margin-left: 6px; }
  .ai-note { border-left: 3px solid var(--fg-faint); padding: 2px 0 8px 12px; margin: 0 0 12px; }

  .ai-note-more { margin: 6px 0 0; }

  .ai-note-uncertain { margin: 6px 0 0; font-size: 12.5px; color: var(--fg-muted); }
  .tag-note-review, .conflict-note { font-size: 12px; color: var(--fg-faint); margin: 6px 0 0; }
  .conflict-attr { font-weight: 700; font-size: 13px; margin: 10px 0 4px; }
  .conflict-val { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--border); }
  .conflict-val-v { font-family: var(--font-mono); font-weight: 600; }
  .conflict-val-src { color: var(--fg-muted); }
  .dwg-alias { font-size: 11.5px; color: var(--fg-faint); font-weight: 400; font-family: var(--font-ui); }
  details.dwg-guide { margin-top: 8px; font-size: 12.5px; color: var(--fg-muted); }
  details.dwg-guide > summary { padding: 8px 4px; font-size: 12px; text-transform: none; letter-spacing: normal; font-weight: 600; justify-content: flex-start; }
  details.dwg-guide .dwg-guide-body { padding: 0 4px 8px; }
  details.dwg-guide h4 { margin: 10px 0 4px; font-size: 12.5px; color: var(--fg); }
  details.dwg-guide p { margin: 4px 0; }

  details.dwg-guide code { font-family: var(--font-mono); }
  .dwg-guide-note { color: var(--fg-faint); font-size: 11.5px; }

  .related-group + .related-group { margin-top: 14px; }
  .related-group-title { font-size: 12.5px; font-weight: 700; color: var(--fg-muted); margin: 0 0 6px; }
  .related-item { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border); }
  .related-item:first-child { border-top: none; }
  .related-dwg { font-family: var(--font-mono); font-weight: 600; }
  .related-title { color: var(--fg-muted); margin-top: 2px; }

  .manual-item { font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--border); }
  .manual-item:first-child { border-top: none; }
  .manual-page { font-family: var(--font-mono); color: var(--fg-faint); font-size: 12px; }
  .manual-excerpt { color: var(--fg-muted); font-size: 12.5px; margin-top: 4px; line-height: 1.5; }

  .diag-line { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-faint); padding: 3px 0; word-break: break-all; }

  /* status states */
  .state-block { padding: 32px 20px; text-align: center; color: var(--fg-muted); }
  .state-block .state-title { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
  .state-block .state-desc { font-size: 13.5px; line-height: 1.6; }
  .retry-btn {
    margin-top: 14px;
    border: 1px solid var(--border-strong);
    background: var(--bg-sunken);
    color: var(--fg);
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .variant-tried {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .variant-tried span { background: var(--bg-sunken); padding: 3px 8px; border-radius: 6px; }

  .skeleton {
    background: linear-gradient(90deg, var(--bg-sunken) 25%, var(--border) 37%, var(--bg-sunken) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none; }
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .skeleton-card { padding: 16px; }
  .skeleton-line { height: 14px; margin-bottom: 8px; }
  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w40 { width: 40%; }
  .skeleton-line.w80 { width: 80%; }

  .loading-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--fg-faint);
    padding: 2px 4px;
  }
  .spinner {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: spin 1.6s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  footer.app-footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--fg-faint);
    padding: 8px 14px 28px;
  }

  @media (min-width: 700px) {
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .two-col > .card { margin: 0; }
  }

  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate-card {
    width: 100%;
    max-width: 320px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    text-align: center;
  }
  .gate-card h1 { font-size: 16px; margin: 0 0 6px; }
  .gate-card p { font-size: 13px; color: var(--fg-muted); margin: 0 0 18px; }
  .gate-card input {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.3em;
    text-align: center;
    padding: 12px 0;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--bg-sunken);
    color: var(--fg);
    margin-bottom: 12px;
  }
  .gate-card input:focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .gate-card button {
    width: 100%;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 8px;
    padding: 11px 0;
    font-weight: 600;
    font-size: 14px;
  }
  .gate-error { color: var(--trip-fg); font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  /* Ledger uses document sections, not nested result cards. */
  .equipment-ledger { border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
  .ledger-header { padding: 24px 24px 18px; }
  .ledger-header h2 { margin: 0 0 12px; font-size: 22px; line-height: 1.4; overflow-wrap: anywhere; letter-spacing: -.02em; }
  .ledger-caution { color: var(--fg); background: var(--bg-raised); border: 1px solid var(--border-strong); padding: 12px 14px; font-size: 13px; line-height: 1.75; margin: 0; max-width: 75ch; }
  .ledger-nav { display: flex; flex-wrap: wrap; gap: 4px 8px; padding: 8px 18px; border-block: 1px solid var(--border-strong); background: var(--bg-raised); }
  .ledger-nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 4px 8px; color: var(--fg); font-size: 13px; font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .ledger-nav a:hover { background: var(--bg-sunken); }
  .equipment-ledger a:focus-visible, .ledger-section:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .ledger-section { padding: 24px; scroll-margin-top: 24px; }
  .ledger-section + .ledger-section { border-top: 1px solid var(--border-strong); }
  .ledger-section h3 { margin: 0 0 16px; font-size: 17px; font-weight: 700; line-height: 1.5; }
  .ledger-record + .ledger-record { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .ledger-record h4 { margin: 0 0 12px; font-size: 13px; color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
  .ledger-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin: 0; }
  .ledger-facts > div { min-width: 0; display: grid; grid-template-columns: minmax(0, 100px) minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-content: start; }
  .ledger-facts dt { color: var(--fg-muted); font-size: 12px; line-height: 1.7; }
  .ledger-facts dd { margin: 0; color: var(--fg); font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .ledger-note, .ledger-source { margin: 10px 0 0; font-size: 12px; line-height: 1.75; color: var(--fg-muted); overflow-wrap: anywhere; white-space: pre-wrap; max-width: 75ch; }
  .ledger-source { font-variant-numeric: tabular-nums; }
  .ledger-drawings { list-style: none; padding: 0; margin: 16px 0 0; }
  .ledger-drawings li { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; overflow-wrap: anywhere; }
  .ledger-drawings a { color: var(--accent-soft-fg); text-underline-offset: 3px; line-height: 1.8; }
  .ledger-drawings a:hover { text-decoration-thickness: 2px; }
  .ledger-image { margin: 0; }
  .ledger-image figcaption { font-size: 13px; font-weight: 600; line-height: 1.8; margin-bottom: 12px; overflow-wrap: anywhere; }
  .ledger-image img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--border-strong); }
  .ledger-image > img { max-height: 440px; object-fit: contain; }
  .ledger-zoom { margin-top: 12px; }
  .ledger-zoom summary { width: fit-content; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer; color: var(--fg); font-weight: 600; }
  .ledger-zoom summary:hover { background: var(--surface); }
  .ledger-zoom summary:focus-visible, .ledger-zoom-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .ledger-zoom-scroll { max-height: 70vh; max-width: 100%; overflow: auto; overscroll-behavior: contain; border: 1px solid var(--border-strong); }
  .ledger-zoom-scroll img { width: auto; height: auto; max-width: none; max-height: none; border: 0; }
  .ledger-gaps { padding-left: 20px; margin: 0; color: var(--fg); font-size: 13px; line-height: 1.8; }
  .ledger-gaps li { padding: 4px 0; overflow-wrap: anywhere; }
  .ledger-section .ledger-caution { margin-bottom: 16px; }
  .equipment-ledger ::selection { color: var(--accent-fg); background: var(--accent); }
  @media (max-width: 600px) {
    .ledger-header, .ledger-section { padding: 20px 16px; }
    .ledger-header h2 { font-size: 20px; }
    .ledger-facts { grid-template-columns: minmax(0, 1fr); }
    .ledger-facts > div { grid-template-columns: minmax(0, 100px) minmax(0, 1fr); }
    .ledger-nav { padding: 6px 8px; gap: 0; }
  }


/*
  DESIGN SYSTEM — 설비 태그 검색
  Industrial Document Workbench  ·  Blue-Slate palette
  Impeccable redesign pass
*/
  :root {
    /* ── Canvas & surfaces ── */
    --bg: #f8fafc;
    --bg-raised: #ffffff;
    --bg-sunken: #f1f5f9;
    --fg: #0f172a;
    --fg-muted: #475569;
    --fg-faint: #94a3b8;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    /* ── Accent (blue-700) ── */
    --accent: #1d4ed8;
    --accent-fg: #ffffff;
    --accent-soft-bg: #eff6ff;
    --accent-soft-fg: #1e40af;
    --focus: #2563eb;

    /* ── Identity header ── */
    --header-bg: #0f172a;
    --header-fg: #f8fafc;
    --header-fg-muted: #64748b;
    --header-border: #1e293b;

    /* ── Semantic status ── */
    --trip-bg: #fff1f2;
    --trip-fg: #be123c;
    --trip-stripe: #e11d48;
    --interlock-bg: #fffbeb;
    --interlock-fg: #92400e;
    --protection-bg: #faf5ff;
    --protection-fg: #6d28d9;
    --annunciator-bg: #fefce8;
    --annunciator-fg: #854d0e;
    --sequence-bg: #eff6ff;
    --sequence-fg: #1d4ed8;
    --control-bg: #f0fdfa;
    --control-fg: #0f766e;

    --confirmed-bg: #f0fdf4;
    --confirmed-fg: #15803d;
    --mentioned-bg: #f8fafc;
    --mentioned-fg: #64748b;

    /* ── Depth ── */
    --shadow-xs: 0 1px 2px rgba(15,23,42,0.06);
    --shadow: 0 1px 3px rgba(15,23,42,0.08), 0 1px 2px rgba(15,23,42,0.05);
    --shadow-md: 0 4px 16px rgba(15,23,42,0.1), 0 2px 4px rgba(15,23,42,0.06);
    --shadow-lg: 0 10px 32px rgba(15,23,42,0.14), 0 4px 8px rgba(15,23,42,0.08);

    /* ── Geometry ── */
    --radius: 8px;
    --radius-sm: 5px;
    --radius-lg: 12px;

    /* ── Typography ── */
    --font-ui: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", "Consolas", monospace;
  }

  /* ── Dark mode (prefers-color-scheme) ── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0f1a;
      --bg-raised: #0f172a;
      --bg-sunken: #070d16;
      --fg: #f1f5f9;
      --fg-muted: #94a3b8;
      --fg-faint: #475569;
      --border: #1e293b;
      --border-strong: #334155;

      --accent: #60a5fa;
      --accent-fg: #0f172a;
      --accent-soft-bg: #0f2a4a;
      --accent-soft-fg: #93c5fd;
      --focus: #60a5fa;

      --header-bg: #020617;
      --header-fg: #f1f5f9;
      --header-fg-muted: #475569;
      --header-border: #0f172a;

      --trip-bg: #2d0a14; --trip-fg: #fda4af; --trip-stripe: #e11d48;
      --interlock-bg: #291b06; --interlock-fg: #fcd34d;
      --protection-bg: #1e1030; --protection-fg: #c4b5fd;
      --annunciator-bg: #231c05; --annunciator-fg: #fde68a;
      --sequence-bg: #0d1f3c; --sequence-fg: #93c5fd;
      --control-bg: #0a1f1e; --control-fg: #5eead4;

      --confirmed-bg: #0c2318; --confirmed-fg: #86efac;
      --mentioned-bg: #0f172a; --mentioned-fg: #64748b;

      --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
      --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 32px rgba(0,0,0,0.7), 0 4px 8px rgba(0,0,0,0.4);
    }
  }

  /* ── Dark mode (data-theme attribute) ── */
  :root[data-theme="dark"] {
    --bg: #0a0f1a;
    --bg-raised: #0f172a;
    --bg-sunken: #070d16;
    --fg: #f1f5f9;
    --fg-muted: #94a3b8;
    --fg-faint: #475569;
    --border: #1e293b;
    --border-strong: #334155;

    --accent: #60a5fa;
    --accent-fg: #0f172a;
    --accent-soft-bg: #0f2a4a;
    --accent-soft-fg: #93c5fd;
    --focus: #60a5fa;

    --header-bg: #020617;
    --header-fg: #f1f5f9;
    --header-fg-muted: #475569;
    --header-border: #0f172a;

    --trip-bg: #2d0a14; --trip-fg: #fda4af; --trip-stripe: #e11d48;
    --interlock-bg: #291b06; --interlock-fg: #fcd34d;
    --protection-bg: #1e1030; --protection-fg: #c4b5fd;
    --annunciator-bg: #231c05; --annunciator-fg: #fde68a;
    --sequence-bg: #0d1f3c; --sequence-fg: #93c5fd;
    --control-bg: #0a1f1e; --control-fg: #5eead4;
    --confirmed-bg: #0c2318; --confirmed-fg: #86efac;
    --mentioned-bg: #0f172a; --mentioned-fg: #64748b;

    --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
    --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.3);
    --shadow-lg: 0 10px 32px rgba(0,0,0,0.7), 0 4px 8px rgba(0,0,0,0.4);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    font-family: var(--font-ui);
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ══════════════════════════════════════════
     APP SHELL
  ══════════════════════════════════════════ */
  .app {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* ══════════════════════════════════════════
     TOPBAR — two-zone design
     Zone 1: dark identity bar (header-bg)
     Zone 2: light tab bar (bg)
  ══════════════════════════════════════════ */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
  }

  /* ── Zone 1: Identity bar ── */
  .app-identity {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
  }
  .app-mark {
    flex-shrink: 0;
    color: var(--accent);
    display: block;
  }

  .app-mark { color: #60a5fa; }
  .app-wordmark-group {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .app-wordmark {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--header-fg);
    white-space: nowrap;
    line-height: 1.2;
  }
  .app-subtitle {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--header-fg-muted);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .app-identity-spacer { flex: 1; }

  /* ── Zone 2: Tab bar ── */
  .app-tabs {
    display: flex;
    padding: 0 4px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .app-tabs::-webkit-scrollbar { display: none; }

  .app-tab {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 14px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.005em;
    line-height: 1;
    transition: color 0.1s ease, border-color 0.1s ease;
    margin-bottom: -1px;
    flex-shrink: 0;
  }
  .app-tab:hover { color: var(--fg); }
  .app-tab:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
    border-radius: 3px 3px 0 0;
  }
  .app-tab--active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── Theme toggle (now lives inside .app-identity) ── */
  .theme-toggle {
    appearance: none;
    background: none;
    border: 1px solid var(--header-border);
    border-radius: var(--radius-sm);
    padding: 6px;
    color: var(--header-fg-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color 0.1s, border-color 0.1s;
  }
  .theme-toggle:hover {
    color: var(--header-fg);
    border-color: var(--fg-faint);
  }
  .theme-toggle svg { width: 16px; height: 16px; display: block; }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ══════════════════════════════════════════
     SEARCH FORM — prominent, workbench feel
  ══════════════════════════════════════════ */
  .search-form {
    display: flex;
    align-items: stretch;
    margin: 14px 14px 10px;
    background: var(--bg-raised);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12), var(--shadow-md);
  }
  .search-form input[type="search"] {
    flex: 1;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 14.5px;
    letter-spacing: 0.01em;
    padding: 13px 14px;
    min-width: 0;
  }
  .search-form input[type="search"]::placeholder { color: var(--fg-faint); font-family: var(--font-ui); font-size: 13.5px; }
  .search-form input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search-form input[type="search"]:focus { outline: none; }
  #searchBtn {
    appearance: none;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    padding: 0 20px;
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.1s;
    white-space: nowrap;
  }
  #searchBtn:hover { background: var(--accent-soft-fg); }
  #searchBtn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ══════════════════════════════════════════
     RESULTS AREA
  ══════════════════════════════════════════ */
  #results {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── Result meta bar ── */
  .result-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--fg-faint);
    padding: 2px 2px 4px;
    flex-wrap: wrap;
  }
  .result-meta strong { font-weight: 700; color: var(--fg-muted); }

  /* ══════════════════════════════════════════
     CARDS — drawing result cards
  ══════════════════════════════════════════ */
  .card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-xs);
    overflow: hidden;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--border-strong);
  }

  .card-header {
    padding: 12px 14px 10px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .card-header-main { flex: 1; min-width: 0; }

  .pid-number {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
    color: var(--accent-soft-fg);
    line-height: 1.3;
  }
  :root[data-theme="dark"] .pid-number { color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pid-number { color: var(--accent); }
  }

  .pid-title {
    font-size: 12.5px;
    color: var(--fg-muted);
    margin-top: 2px;
    overflow-wrap: anywhere;
    line-height: 1.4;
  }

  .discipline-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .card-body { padding: 10px 14px 12px; }
  .card-action {
    padding: 8px 14px 10px;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .btn-sm {
    appearance: none;
    background: var(--bg-sunken);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, color 0.1s;
  }
  .btn-sm:hover { background: var(--border); color: var(--fg); }
  .btn-sm:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ── Expand toggle ── */
  .expand-toggle {
    appearance: none;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px;
    width: 100%;
    text-align: left;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    border-top: 1px solid var(--border);
    transition: color 0.1s, background 0.1s;
  }
  .expand-toggle:hover { background: var(--bg-sunken); color: var(--fg); }
  .expand-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .expand-toggle svg { transition: transform 0.2s; flex-shrink: 0; }
  .expand-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* ── Drawing list inside card ── */
  .drawing-list {
    list-style: none;
    padding: 0;
    margin: 0;
    border-top: 1px solid var(--border);
  }
  .drawing-list-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.5;
  }
  .drawing-list-item:last-child { border-bottom: 0; }
  .drawing-num {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 12.5px;
    color: var(--accent-soft-fg);
    letter-spacing: 0.01em;
    white-space: nowrap;
    flex-shrink: 0;
    padding-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  :root[data-theme="dark"] .drawing-num { color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .drawing-num { color: var(--accent); }
  }
  .drawing-title { color: var(--fg); overflow-wrap: anywhere; }
  .drawing-link { color: var(--accent-soft-fg); text-underline-offset: 3px; }
  .drawing-link:hover { text-decoration-thickness: 2px; }

  /* ── Logic sheet display ── */
  .logic-sheet {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
  }
  .logic-sheet-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-faint);
    margin-bottom: 2px;
  }
  .logic-ref {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-muted);
    overflow-wrap: anywhere;
  }

  /* ── Type / discipline badges ── */
  .badge-trip { background: var(--trip-bg); color: var(--trip-fg); }
  .badge-interlock { background: var(--interlock-bg); color: var(--interlock-fg); }
  .badge-protection { background: var(--protection-bg); color: var(--protection-fg); }
  .badge-annunciator { background: var(--annunciator-bg); color: var(--annunciator-fg); }
  .badge-sequence { background: var(--sequence-bg); color: var(--sequence-fg); }
  .badge-control { background: var(--control-bg); color: var(--control-fg); }
  .badge-confirmed { background: var(--confirmed-bg); color: var(--confirmed-fg); }
  .badge-mentioned { background: var(--mentioned-bg); color: var(--mentioned-fg); }

  /* ── Trip stripe marker ── */
  .trip-stripe::before {
    content: '';
    display: block;
    height: 3px;
    background: var(--trip-stripe);
    border-radius: 3px 3px 0 0;
    margin-bottom: -1px;
  }

  /* ── Load more ── */
  .load-more {
    appearance: none;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 10px 20px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    width: 100%;
    transition: background 0.1s, color 0.1s;
    box-shadow: var(--shadow-xs);
  }
  .load-more:hover { background: var(--bg-sunken); color: var(--fg); }
  .load-more:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .load-more-hint { font-size: 11.5px; color: var(--fg-faint); margin-top: 4px; text-align: center; }

  /* ══════════════════════════════════════════
     MANUAL EXCERPT
  ══════════════════════════════════════════ */
  .manual-page { font-family: var(--font-mono); color: var(--fg-faint); font-size: 12px; }
  .manual-excerpt { color: var(--fg-muted); font-size: 12.5px; margin-top: 4px; line-height: 1.5; }

  .diag-line { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-faint); padding: 3px 0; word-break: break-all; }

  /* ══════════════════════════════════════════
     STATUS / EMPTY STATES
  ══════════════════════════════════════════ */
  .state-block {
    padding: 36px 20px;
    text-align: center;
    color: var(--fg-muted);
  }
  .state-block .state-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 6px;
    letter-spacing: -0.015em;
  }
  .state-block .state-desc { font-size: 13.5px; line-height: 1.6; }
  .retry-btn {
    margin-top: 14px;
    border: 1px solid var(--border-strong);
    background: var(--bg-sunken);
    color: var(--fg);
    border-radius: var(--radius);
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-ui);
  }
  .retry-btn:hover { background: var(--border); }
  .variant-tried {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .variant-tried span { background: var(--bg-sunken); padding: 3px 8px; border-radius: var(--radius-sm); }

  /* ══════════════════════════════════════════
     SKELETON / LOADING
  ══════════════════════════════════════════ */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-sunken) 25%, var(--border) 37%, var(--bg-sunken) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: var(--radius-sm);
  }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .skeleton-card { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .skeleton-line { height: 14px; }
  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w40 { width: 40%; }
  .skeleton-line.w80 { width: 80%; }

  .loading-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--fg-faint);
    padding: 2px 4px;
  }
  .spinner {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: spin 1.6s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ══════════════════════════════════════════
     FOOTER
  ══════════════════════════════════════════ */
  footer.app-footer {
    text-align: center;
    font-size: 11px;
    color: var(--fg-faint);
    padding: 8px 14px 32px;
    margin-top: auto;
    border-top: 1px solid var(--border);
  }

  /* ══════════════════════════════════════════
     CATALOG TOOLBAR
  ══════════════════════════════════════════ */
  .catalog-toolbar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
    box-shadow: var(--shadow-xs);
  }
  .catalog-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-faint);
    min-width: 32px;
    flex-shrink: 0;
  }
  .catalog-filter, .catalog-source-btn, .equip-filter {
    appearance: none;
    background: var(--bg-sunken);
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    padding: 4px 10px;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .catalog-filter:hover, .catalog-source-btn:hover, .equip-filter:hover {
    background: var(--border);
    color: var(--fg);
  }
  .catalog-filter--active, .catalog-source-btn--active, .equip-filter--active {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .catalog-filter:focus-visible, .catalog-source-btn:focus-visible, .equip-filter:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .aux-badge {
    background: var(--sequence-bg);
    color: var(--sequence-fg);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 100px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ── Catalog search form ── */
  .catalog-search-form {
    display: flex;
    align-items: stretch;
    background: var(--bg-raised);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .catalog-search-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  #catalogSearchInput {
    flex: 1;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 10px;
    min-width: 0;
  }
  #catalogSearchInput::placeholder { color: var(--fg-faint); font-family: var(--font-ui); font-size: 12.5px; }
  #catalogSearchInput:focus { outline: none; }
  #catalogSearchBtn {
    appearance: none;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    padding: 0 14px;
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.1s;
  }
  #catalogSearchBtn:hover { background: var(--accent-soft-fg); }
  #catalogSearchBtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ── Catalog note ── */
  .catalog-note {
    padding: 7px 14px;
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--border);
  }
  .discipline-note {
    font-size: 11.5px;
    color: var(--fg-faint);
    line-height: 1.6;
  }

  /* ══════════════════════════════════════════
     CATALOG RESULTS
  ══════════════════════════════════════════ */
  .catalog-results {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Catalog group header ── */
  .catalog-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 8px;
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-faint);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .catalog-group-count {
    background: var(--border-strong);
    color: var(--fg-muted);
    border-radius: 100px;
    padding: 1px 7px;
    font-size: 10.5px;
    font-weight: 700;
  }

  /* ── Catalog drawing row ── */
  .catalog-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
    text-decoration: none;
    color: var(--fg);
    transition: background 0.1s;
  }
  .catalog-row:hover { background: var(--accent-soft-bg); }
  .catalog-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  .catalog-row-num {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-soft-fg);
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 120px;
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  :root[data-theme="dark"] .catalog-row-num { color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .catalog-row-num { color: var(--accent); }
  }

  .catalog-row-body { flex: 1; min-width: 0; }
  .catalog-row-title {
    font-size: 13px;
    color: var(--fg);
    overflow-wrap: anywhere;
    line-height: 1.4;
  }
  .catalog-row-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--fg-muted);
  }
  .catalog-row-meta span { white-space: nowrap; }

  .catalog-kosep {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-faint);
    white-space: nowrap;
  }
  .catalog-discipline-tag {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .catalog-has-file {
    color: var(--confirmed-fg);
    font-size: 11px;
    font-weight: 700;
  }

  /* ── Catalog pager ── */
  .catalog-pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .catalog-pager button {
    appearance: none;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    min-width: 36px;
    transition: background 0.1s, color 0.1s;
  }
  .catalog-pager button:hover { background: var(--bg-sunken); color: var(--fg); }
  .catalog-pager button[aria-current="page"] {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .catalog-pager button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ══════════════════════════════════════════
     TWO-COLUMN (desktop cards)
  ══════════════════════════════════════════ */
  @media (min-width: 700px) {
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .two-col > .card { margin: 0; }
  }

  /* ══════════════════════════════════════════
     GATE SCREEN
  ══════════════════════════════════════════ */
  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
  }
  .gate-card {
    width: 100%;
    max-width: 340px;
    background: var(--bg-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  /* ── Gate brand zone (dark navy header) ── */
  .gate-brand {
    background: var(--header-bg);
    padding: 28px 24px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .gate-mark { color: #60a5fa; display: block; }
  .gate-wordmark {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--header-fg);
    line-height: 1.2;
  }
  .gate-subtext {
    font-size: 11.5px;
    color: var(--header-fg-muted);
    letter-spacing: 0.01em;
    margin-top: -4px;
  }

  /* ── Gate form area ── */
  .gate-form-area {
    padding: 22px 24px 24px;
  }
  .gate-form-area > p {
    font-size: 13px;
    color: var(--fg-muted);
    margin: 0 0 14px;
    text-align: center;
  }
  /* Legacy h1 in gate (for safety if old HTML) */
  .gate-card h1 { font-size: 14px; font-weight: 600; margin: 0 0 14px; text-align: center; color: var(--fg); }
  .gate-card input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.35em;
    text-align: center;
    padding: 13px 0;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg-sunken);
    color: var(--fg);
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .gate-card input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }
  .gate-card button[type="submit"] {
    width: 100%;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius);
    padding: 12px 0;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.1s;
  }
  .gate-card button[type="submit"]:hover { background: var(--accent-soft-fg); }
  .gate-card button[type="submit"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .gate-error { color: var(--trip-fg); font-size: 12.5px; margin-top: 10px; min-height: 16px; text-align: center; }

  /* ══════════════════════════════════════════
     EQUIPMENT LEDGER
  ══════════════════════════════════════════ */
  .equipment-ledger {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg-raised);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .ledger-header {
    padding: 20px 20px 16px;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border-strong);
  }
  .ledger-header h2 {
    margin: 0 0 10px;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.3;
    overflow-wrap: anywhere;
    letter-spacing: -0.03em;
    color: var(--fg);
  }
  .ledger-caution {
    color: var(--fg);
    background: var(--bg-sunken);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.75;
    margin: 0;
    max-width: 75ch;
  }
  .ledger-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 4px;
    padding: 6px 16px;
    border-block: 1px solid var(--border-strong);
    background: var(--bg-sunken);
  }
  .ledger-nav a {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 3px 8px;
    color: var(--fg-muted);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    border-radius: var(--radius-sm);
    transition: background 0.1s, color 0.1s;
  }
  .ledger-nav a:hover { background: var(--border); color: var(--fg); }
  .equipment-ledger a:focus-visible, .ledger-section:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }
  .ledger-section { padding: 20px; scroll-margin-top: 24px; }
  .ledger-section + .ledger-section { border-top: 1px solid var(--border-strong); }
  .ledger-section h3 {
