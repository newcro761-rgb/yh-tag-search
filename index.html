<script>
(function () {
  'use strict';

  // ======================================================================
  // §0 접근 게이트 — 서버 인증 (PIN → /catalog/session → signed token)
  // 클라이언트에 해시 상수 없음 — 검증은 서버에서만 수행
  // ======================================================================
  var API_BASE = 'https://plant-assistant-mcp.newcro761.workers.dev';
  var CATALOG_SESSION_URL = API_BASE + '/catalog/session';

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', enc).then(function (buf) {
      var bytes = new Uint8Array(buf);
      var hex = '';
      for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
      return hex;
    });
  }

  var gateScreen = document.getElementById('gateScreen');
  var appRoot = document.getElementById('appRoot');
  var gateForm = document.getElementById('gateForm');
  var gateInput = document.getElementById('gateInput');
  var gateError = document.getElementById('gateError');

  // catalogToken lives here — set at gate unlock, shared by all tabs
    var catalogToken = null;
    var CATALOG_TOKEN_KEY = 'tagsearch-catalog-token';
    // initApp()은 페이지 로드당 한 번만 실행(이벤트 리스너 중복 바인딩 방지).
    // initApp이 resumeAfterUnlock을 채우며, 재잠금 후 재해제 시 현재 화면만 다시 그린다.
    var appInitialized = false;
    var resumeAfterUnlock = null;

    function unlockApp(token) {
      catalogToken = token;
      // Persist token (server-signed, 8-hour TTL) so tabs survive a page refresh.
      // On load the stored token is restored and validated server-side on first API call.
      if (token) {
        try { sessionStorage.setItem(CATALOG_TOKEN_KEY, token); } catch (_) {}
      }
      gateScreen.style.display = 'none';
      appRoot.style.display = '';
      if (!appInitialized) {
        appInitialized = true;
        initApp();
      } else if (resumeAfterUnlock) {
        resumeAfterUnlock();
      }
    }

    // 세션 만료/위조 토큰: 토큰 폐기 후 게이트 화면으로 복귀
    function relock(message) {
      catalogToken = null;
      try { sessionStorage.removeItem(CATALOG_TOKEN_KEY); } catch (_) {}
      gateScreen.style.display = '';
      appRoot.style.display = 'none';
      gateError.textContent = message || '';
      gateInput.value = '';
      gateInput.focus();
    }

    // Restore token from previous session (page refresh / back-navigation)
    (function restoreSession() {
      var saved;
      try { saved = sessionStorage.getItem(CATALOG_TOKEN_KEY); } catch (_) {}
      if (saved && typeof saved === 'string' && saved.startsWith('catalog.')) {
        unlockApp(saved);
        return;
      }
      gateInput.focus();
    })();
  gateForm.addEventListener('submit', function (e) {
    e.preventDefault();
    gateError.textContent = '';
    var pin = gateInput.value;
    sha256Hex(pin).then(function (hash) {
      return fetch(CATALOG_SESSION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin_hash: hash })
      });
    }).then(function (res) {
      if (!res) throw new Error('no response');
      if (!res.ok) {
        gateError.textContent = 'PIN이 올바르지 않습니다.';
        gateInput.value = '';
        gateInput.focus();
        return;
      }
      return res.json().then(function (data) {
        if (data && data.token) {
          unlockApp(data.token);
        } else {
          gateError.textContent = '서버 오류 — 다시 시도해주세요.';
          gateInput.value = '';
          gateInput.focus();
        }
      });
    }).catch(function (err) {
      gateError.textContent = '서버 연결 실패: ' + (err.message || '');
      gateInput.value = '';
      gateInput.focus();
    });
  });

  // ======================================================================
  // §1 설정 (initApp 내부에서 실행 — PIN 통과 후에만 동작)
  // ======================================================================
  function initApp() {
  var TOOL_URL = API_BASE + '/catalog/tool';

  // 도면 파일 서빙 베이스 URL(미니PC rclone serve + Cloudflare Tunnel).
  // 비워두면 '열기' 링크를 아예 만들지 않는다 — 주소가 정해지면 여기만 채우면 된다.
  var DRAWING_BASE_URL = 'https://files.plantassist-nth.com';

  // file_path는 구글드라이브 '003 업무' 기준 상대경로이고 한글·공백을 포함한다.
  // 세그먼트별로 인코딩해야 슬래시가 보존된다(전체를 한 번에 인코딩하면 깨짐).
  function drawingUrl(filePath) {
    if (!DRAWING_BASE_URL || !filePath) return null;
    // DB에 맥 절대경로가 남아 있는 행이 있어 Worker에서 정규화하고 있지만,
    // 혹시 새는 값이 있어도 링크가 깨지지 않도록 여기서도 한 번 더 자른다.
    var rel = String(filePath).split(String.fromCharCode(92)).join('/');
    var i = rel.indexOf('003 업무/');
    if (i >= 0) rel = rel.slice(i + '003 업무/'.length);
    rel = rel.replace(/^\/+/, '');
    return DRAWING_BASE_URL.replace(/\/+$/, '') + '/' +
      rel.split('/').map(encodeURIComponent).join('/');
  }
  var CALL_TIMEOUT_MS = 15000;
  var RECENT_KEY = 'tagsearch-recent';
  var THEME_KEY = 'tagsearch-theme';
  var EXAMPLE_TAGS = [
    { value: 'CW-MV03B', label: 'CW-MV03B' },
    { value: 'HO-PSLL41A', label: 'HO-PSLL41A' },
    { value: 'MS-PT', label: 'MS-PT (번호 생략 검색)' },
    { value: 'Governor Free', label: 'Governor Free (로직 키워드 검색)' }
  ];

  var results = document.getElementById('results');
  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');
  var searchBtn = document.getElementById('searchBtn');

  // ======================================================================
  // §2 REST 클라이언트 — 인증 토큰(Bearer)으로 /catalog/tool 호출 / 오류 분류
  // ======================================================================
  function McpError(kind, message) {
    this.kind = kind;
    this.message = message;
  }
  McpError.prototype = Object.create(Error.prototype);

  function fetchWithTimeout(url, options) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, CALL_TIMEOUT_MS);
    options = options || {};
    options.signal = controller.signal;
    return fetch(url, options)
      .then(function (res) { clearTimeout(timer); return res; })
      .catch(function (err) {
        clearTimeout(timer);
        if (err && err.name === 'AbortError') throw new McpError('timeout', 'TIMEOUT');
        throw new McpError('network', String(err && err.message || err));
      });
  }

  function callTool(name, args) {
    var sentToken = catalogToken;
    // 이미 재잠금된 상태(병렬 호출 중 하나가 401을 받은 경우)에서는 요청하지 않는다
    if (!sentToken) return Promise.reject(new McpError('auth', 'NO_TOKEN'));
    return fetchWithTimeout(TOOL_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + sentToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ name: name, arguments: args })
    }).then(function (res) {
      return res.text().then(function (raw) {
        var data = null;
        var parsed = true;
        try { data = JSON.parse(raw); } catch (e) { parsed = false; }
        if (res.status === 401) {
          // 병렬 호출이 동시에 401을 받아도 한 번만 재잠금 (그 사이 새 토큰이 들어왔으면 건드리지 않음)
          if (catalogToken === sentToken) relock('세션이 만료되었습니다. PIN을 다시 입력하세요.');
          throw new McpError('auth', 'HTTP 401');
        }
        if (!res.ok) {
          if ((res.status === 400 || res.status === 404) && parsed && data && data.error) {
            throw new McpError('rpc', String(data.error));
          }
          throw new McpError('network', 'HTTP ' + res.status);
        }
        if (!parsed) throw new McpError('parse', 'INVALID_TOOL_JSON');
        if (!data || typeof data !== 'object') throw new McpError('parse', 'INVALID_TOOL_DATA');
        if (data.error) throw new McpError('rpc', String(data.error));
        return data;
      });
    });
  }

  // ======================================================================
  // §3 태그 정규화 / 변형 생성
  // ======================================================================
  function normalizeInput(raw) {
    return raw.trim().toUpperCase().replace(/\s+/g, '').replace(/[！-～]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    }).replace(/[\u2010-\u2015\u2212]/g, '-'); // 휴대폰·복사 붙여넣기로 들어오는 유니코드 대시
  }

  var TAG_RE = /^([56])?([A-Z]{2,3})-?([A-Z]{2,5}?)-?(\d{1,3})([A-Z]{0,2})$/;
  var BASE_TAG_RE = /^([56])?([A-Z]{2,3})-([A-Z]{2,5})$/;

  function parseTag(norm) {
    var m = TAG_RE.exec(norm);
    if (!m) return null;
    return { unit: m[1] || '', sys: m[2], type: m[3], num: m[4], sfx: m[5] || '' };
  }

  // 숫자 접미 없이 "계통-계기타입"만 입력된 경우 (예: MS-PT, CW-MV)
  function parseBaseTag(norm) {
    var m = BASE_TAG_RE.exec(norm);
    if (!m) return null;
    return { unit: m[1] || '', sys: m[2], type: m[3] };
  }



  function generateVariants(rawInput) {
    var norm = normalizeInput(rawInput);
    var parsed = parseTag(norm);
    if (!parsed) {
      return { parsed: null, variants: [norm], forLookup: norm, altLookups: [] };
    }
    var list = [];
    var seen = {};
    function push(v) { if (v && !seen[v]) { seen[v] = true; list.push(v); } }
    // 계통-타입 사이에 하이픈이 없으면 글자 나눔이 모호하다 (HOPSLL → HO-PSLL / HOP-SLL).
    // 사용자가 하이픈을 넣었으면 그대로 따른다. 모호하면 2글자 계통을 먼저, 나머지 나눔은 대안으로 함께 시도한다.
    var splitGiven = /^[56]?[A-Z]{2,3}-[A-Z]/.test(norm);
    var splits = [{ sys: parsed.sys, type: parsed.type }];
    if (!splitGiven) {
      var letters = parsed.sys + parsed.type;
      splits = [];
      for (var sl = 2; sl <= 3; sl++) {
        var tl = letters.length - sl;
        if (tl >= 2 && tl <= 5) splits.push({ sys: letters.slice(0, sl), type: letters.slice(sl) });
      }
      if (!splits.length) splits = [{ sys: parsed.sys, type: parsed.type }];
      parsed = { unit: parsed.unit, sys: splits[0].sys, type: splits[0].type, num: parsed.num, sfx: parsed.sfx };
    }
    var tail = parsed.num + parsed.sfx;
    var core = parsed.sys + '-' + parsed.type;
    var v1 = core + tail;                      // 하이픈 미삽입
    var v2 = core + '-' + tail;                // 하이픈 삽입 ★핵심
    push(v1);
    push(v2);
    var altLookups = [];
    splits.slice(1).forEach(function (sp) {
      var alt = sp.sys + '-' + sp.type + tail;
      push(alt);
      altLookups.push(parsed.unit ? parsed.unit + alt : alt);
    });
    push(norm);
    // lookup_tag에 던질 대표값: 유닛 접두가 있었으면 보존, 서버가 정규화한다고 명시돼 있음
    var forLookup = parsed.unit ? parsed.unit + v1 : v1;
    return { parsed: parsed, variants: list, forLookup: forLookup, altLookups: altLookups };
  }

  var FGD_SYS = { FG: 1, FD: 1, AB: 1, GG: 1, LS: 1, GY: 1, SD: 1, WW: 1, DE: 1, DS: 1 };

  function primaryLogicBook(parsed) {
    if (parsed && FGD_SYS[parsed.sys]) return 'FGD';
    return 'MAIN';
  }

  // ======================================================================
  // §4 검색 실행 — 병렬 + 단계적 확대
  // ======================================================================

  function runBaseTagScan(rawInput, base, offset) {
    var prefix = base.sys + '-' + base.type;
    return callTool('search_tags', { prefix: prefix, offset: offset || 0, limit: 100 }).then(function (data) {
      if (!Array.isArray(data.results)) throw new McpError('parse', 'INVALID_TAG_RESULTS');
      return { isBaseScan: true, rawInput: rawInput, prefix: data.prefix, total: data.total,
        nextOffset: data.next_offset, found: data.results.map(function (row) {
          return { tag: row.base_tag, instrument: row };
        }) };
    });
  }

  function runSearch(rawInput, renderCtx) {
    var gen = generateVariants(rawInput);

    var baseParsed = !gen.parsed ? parseBaseTag(normalizeInput(rawInput)) : null;
    if (baseParsed) {
      return runBaseTagScan(rawInput, baseParsed);
    }

    var primaryBook = primaryLogicBook(gen.parsed);
    var callLog = [];
    var startTs = Date.now();

    function logCall(desc) { callLog.push(desc + ' (' + (Date.now() - startTs) + 'ms)'); }

    function lookupOne(tag) {
      return callTool('lookup_tag', { tag: tag })
        .then(function (data) { logCall('lookup_tag(' + tag + ') OK'); return data; })
        .catch(function (err) { if (err && err.kind === 'auth') throw err; logCall('lookup_tag(' + tag + ') FAIL: ' + err.message); return null; });
    }
    function lookupHasData(d) {
      if (!d) return false;
      return !!(['field_instruments', 'setpoints', 'pinned_drawings', 'candidate_drawings', 'usages', 'sheets_with_tag_in_title', 'body_mentions'].some(function (k) { return Array.isArray(d[k]) && d[k].length; }) ||
        d.tag_note || d.tag_auto || ledgerRecords(d).length);
    }
    // 하이픈 없는 입력은 계통/타입 나눔이 모호하다 — 대표 조회에 자료가 없을 때만 다른 나눔을 순서대로 시도한다.
    var lookupPromise = lookupOne(gen.forLookup).then(function (first) {
      if (lookupHasData(first) || !(gen.altLookups || []).length) return first;
      var chain = Promise.resolve(null);
      gen.altLookups.forEach(function (alt) {
        chain = chain.then(function (found) { return found || lookupOne(alt).then(function (d) { return lookupHasData(d) ? d : null; }); });
      });
      return chain.then(function (found) { return found || first; });
    });

    // 로직해설서 자유검색 — 태그든 키워드("Governor Free" 등)든 입력 원문 그대로 병렬 조회.
    // 태그 검색 흐름과 완전히 독립적이라 실패해도 나머지 결과에 영향 없음.
    var manualSearchPromise = callTool('search_manual', { query: rawInput.trim() })
      .then(function (data) { logCall('search_manual(' + rawInput.trim() + ') -> ' + ((data.results || []).length) + '건'); return data; })
      .catch(function (err) { if (err && err.kind === 'auth') throw err; logCall('search_manual FAIL: ' + err.message); return null; });

    function searchLogicVariants(book, fallback) {
      return Promise.all(gen.variants.map(function (v) {
        var label = 'search_logic(' + v + ', ' + book + (fallback ? ', fallback' : '') + ')';
        return callTool('search_logic', { query: v, logic_book: book })
          .then(function (data) {
            logCall(label + ' -> ' + ((data.results || []).length) + '건');
            return { variant: v, book: book, data: data };
          })
          .catch(function (err) {
            if (err && err.kind === 'auth') throw err;
            logCall(label + ' FAIL: ' + err.message);
            return { variant: v, book: book, data: null, error: err };
          });
      }));
    }

    // 서버가 태그→시트 색인(body_mentions)을 주면 그걸 쓴다. search_logic은 시트 본문 전수
    // 스캔이라 변형마다 호출하면 D1 무료 읽기 한도를 빠르게 소진한다 — 색인이 없을 때만 폴백.
    return Promise.all([lookupPromise, manualSearchPromise]).then(function (res) {
      var lookupData = res[0];
      var manualData = res[1];
      if (lookupData && Array.isArray(lookupData.body_mentions)) {
        logCall('tag_sheet_index -> ' + lookupData.body_mentions.length + '건');
        var indexed = [{ variant: gen.forLookup, book: 'INDEX', data: { results: lookupData.body_mentions } }];
        return finalize(rawInput, gen, lookupData, indexed, callLog, manualData);
      }
      return searchLogicVariants(primaryBook, false).then(function (searchResults) {
        var anyLogicHit = searchResults.some(function (r) { return r.data && (r.data.results || []).length > 0; });
        var lookupHasUsages = lookupData && lookupData.usages_total > 0;
        if (!anyLogicHit && !lookupHasUsages && primaryBook === 'MAIN') {
          // 2단계 확대: FGD로 재시도
          return searchLogicVariants('FGD', true).then(function (fbResults) {
            return finalize(rawInput, gen, lookupData, searchResults.concat(fbResults), callLog, manualData);
          });
        }
        return finalize(rawInput, gen, lookupData, searchResults, callLog, manualData);
      });
    });
  }

  function finalize(rawInput, gen, lookupData, searchResults, callLog, manualData) {
    var failures = [];
    if (!lookupData) failures.push('태그·도면·계기 정보');
    if (!manualData) failures.push('로직해설서');
    searchResults.forEach(function (r) { if (!r.data && failures.indexOf('로직 검색') < 0) failures.push('로직 검색'); });
    if (lookupData && lookupData.warnings) failures = failures.concat(lookupData.warnings);
    if (!lookupData && !manualData && !searchResults.some(function (r) { return !!r.data; })) {
      throw new McpError('network', '모든 조회 요청이 실패했습니다.');
    }
    var merged = mergeLogicSheets(lookupData, searchResults);
    var drawings = mergeDrawings(lookupData);
    var manualSearch = (manualData && manualData.results) || [];
    return {
      failures: failures,
      rawInput: rawInput,
      gen: gen,
      lookup: lookupData,
      logicSheets: merged,
      drawings: drawings,
      manualSearch: manualSearch,
      callLog: callLog
    };
  }

  // ======================================================================
  // §5 결과 병합 / 중복제거 / 분류
  // ======================================================================
  function cleanStr(s) {
    if (s == null) return '';
    return String(s).replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function mergeLogicSheets(lookupData, searchResults) {
    var map = {};
    var order = [];

    function upsert(key, patch, source, variant) {
      var rec = map[key];
      if (!rec) {
        rec = { key: key, logic_book: patch.logic_book, drop_no: patch.drop_no, sheet_no: patch.sheet_no,
                 title: '', pdf_page: null, sources: {}, matchedVariants: {}, isSource: null };
        map[key] = rec;
        order.push(key);
      }
      if (!rec.title && patch.title) rec.title = patch.title;
      if (rec.pdf_page == null && patch.pdf_page != null) rec.pdf_page = patch.pdf_page;
      if (source) rec.sources[source] = true;
      if (variant) rec.matchedVariants[variant] = true;
      if (patch.isSource === 1) rec.isSource = 1;
      else if (patch.isSource === 0 && rec.isSource == null) rec.isSource = 0;
    }

    if (lookupData) {
      (lookupData.usages || []).forEach(function (u) {
        var key = u.logic_book + '|' + u.drop_no + '|' + u.sheet_no;
        upsert(key, { logic_book: u.logic_book, drop_no: u.drop_no, sheet_no: u.sheet_no, title: u.title, pdf_page: u.pdf_page, isSource: u.is_source }, 'usage', null);
      });
      (lookupData.sheets_with_tag_in_title || []).forEach(function (s) {
        var key = s.logic_book + '|' + s.drop_no + '|' + s.sheet_no;
        upsert(key, { logic_book: s.logic_book, drop_no: s.drop_no, sheet_no: s.sheet_no, title: s.title, pdf_page: s.pdf_page }, 'usage', null);
      });
    }

    searchResults.forEach(function (r) {
      if (!r.data || !r.data.results) return;
      r.data.results.forEach(function (s) {
        var key = s.logic_book + '|' + s.drop_no + '|' + s.sheet_no;
        upsert(key, { logic_book: s.logic_book, drop_no: s.drop_no, sheet_no: s.sheet_no, title: s.title, pdf_page: s.pdf_page }, 'search', r.variant);
      });
    });

    var list = order.map(function (k) { return map[k]; });
    list.forEach(function (rec) { rec.categories = classifySheet(rec.title); });

    var catRank = { trip: 0, interlock: 1, protection: 2, sequence: 3, annunciator: 4, control: 5 };
    function bestCatRank(rec) {
      var best = 99;
      rec.categories.forEach(function (c) { if (catRank[c] != null && catRank[c] < best) best = catRank[c]; });
      return best;
    }
    list.sort(function (a, b) {
      var ca = bestCatRank(a), cb = bestCatRank(b);
      if (ca !== cb) return ca - cb;
      var ua = a.sources.usage ? 0 : 1, ub = b.sources.usage ? 0 : 1;
      if (ua !== ub) return ua - ub;
      var sa = a.isSource === 1 ? 0 : 1, sb = b.isSource === 1 ? 0 : 1;
      if (sa !== sb) return sa - sb;
      if (a.logic_book !== b.logic_book) return a.logic_book === 'MAIN' ? -1 : 1;
      var da = parseInt(a.drop_no, 10) || 0, db = parseInt(b.drop_no, 10) || 0;
      if (da !== db) return da - db;
      return String(a.sheet_no).localeCompare(String(b.sheet_no), undefined, { numeric: true });
    });
    return list;
  }

  var CATEGORY_RULES = [
    ['trip', /\bTRIP\b|\bTRIPPING\b|\bMFT\b|EMERGENCY|SHUTDOWN|\bESD\b/],
    ['interlock', /INTERLOCK|\bILK\b|PERMISSIVE|PERMIT|\bLOCKOUT\b/],
    ['protection', /PROTECT|SAFETY|MECHANICAL TRIP|\bLIMIT\b/],
    ['annunciator', /ANNUNCIATOR|ANNUCIATOR|\bANN\b|ALARM|COUNTER/],
    ['sequence', /\bSQC\b|SEQUENCE|\bSTEP\b|AUTO\s*START|\bSTARTUP\b/],
    ['control', /CONTROL|MASTER|SETPOINT|\bPID\b|MODULAT/]
  ];

  function classifySheet(title) {
    if (!title) return [];
    var t = title.toUpperCase();
    var cats = [];
    CATEGORY_RULES.forEach(function (rule) {
      if (rule[1].test(t)) cats.push(rule[0]);
    });
    return cats;
  }

  var CAT_LABEL = { trip: '트립', interlock: '인터록', protection: '보호', annunciator: '경보', sequence: '시퀀스', control: '제어' };

  function mergeDrawings(lookupData) {
    if (!lookupData) return [];
    var byNo = {};
    var order = [];
    function keyOf(no) { return cleanStr(no).replace(/\s+/g, '').toUpperCase(); }
    function upsert(no, title, tier, filePath, pdfPage, alias, docMeta) {
      no = cleanStr(no);
      if (!no) return;
      var k = keyOf(no);
      var rec = byNo[k];
      if (!rec) {
        rec = { dwg_no: no, title: cleanStr(title), tier: tier, file_path: filePath || null, pdf_page: pdfPage || null, doc_meta: docMeta || null };
        byNo[k] = rec;
        order.push(k);
      } else {
        if (tier < rec.tier) { rec.tier = tier; if (title) rec.title = cleanStr(title); }
        if (!rec.title && title) rec.title = cleanStr(title);
        // 같은 도면번호가 여러 티어에서 들어올 수 있다. 실물 경로는 먼저 발견된 것을 유지.
        if (!rec.file_path && filePath) { rec.file_path = filePath; rec.pdf_page = pdfPage || null; }
      }
      // doc_meta(stage 등)는 먼저 발견된 비어있지 않은 값을 유지
      if (rec.doc_meta == null && docMeta) rec.doc_meta = docMeta;
      // 공급사 번호로 적힌 같은 도면: KOSEP 번호 하나로 합치고 원래 번호는 별칭으로 남긴다
      if (alias && alias !== no) {
        rec.aliases = rec.aliases || [];
        if (rec.aliases.indexOf(alias) < 0) rec.aliases.push(alias);
      }
    }
    (lookupData.pinned_drawings || []).forEach(function (d) { upsert(d.dwg_no, d.title, 0, d.file_path, d.pdf_page, null, d.doc_meta); });
    (lookupData.field_instruments || []).forEach(function (fi) {
      if (!fi.pid_dwg_no) return;
      var pr = fi.pid_dwg_resolved;
      if (pr && pr.kosep_id) upsert(pr.kosep_id, pr.title || fi.service_desc, 1, pr.file_path, pr.pdf_page, fi.pid_dwg_no);
      else upsert(fi.pid_dwg_no, fi.service_desc, 1);
    });
    (lookupData.field_instruments || []).forEach(function (fi) {
      if (fi.vendor_dwg_resolved && fi.vendor_dwg_resolved.kosep_id) {
        upsert(fi.vendor_dwg_resolved.kosep_id, fi.vendor_dwg_resolved.title, 1.5, fi.vendor_dwg_resolved.file_path, fi.vendor_dwg_resolved.pdf_page);
      }
    });
    (lookupData.candidate_drawings || []).forEach(function (d) { upsert(d.dwg_no || d.kosep_id, d.title, 2, d.file_path, d.pdf_page, null, d.doc_meta); });
    return order.map(function (k) { return byNo[k]; });
  }

  // 공급사 번호 표기: 히타치 패턴(310PB52-576)이면 회사명을, 아니면 일반 표기를 쓴다
  function supplierLabel(no) { return /^\d{3}[A-Z]{2}\d{2}-\d{3}$/.test(no) ? '히타치 번호' : '공급사 번호'; }

  // 도면번호 읽는 법 (정적 안내 — textContent 기반으로만 만든다)
  function buildDwgGuide() {
    var rows = [
      ['1번째', 'L', '거의 전부 L (5,6호기 공용 문서). 5로 시작하는 9건은 5호기 전용으로 보임'],
      ['2번째', '31300', '계통 번호. 예: 11600 주증기·재열, 15100 급수, 31300 터빈 증기, 31400 터빈 오일, 36130 복수, 36420 순환수, 36610 폐회로 냉각수, 56000 계장루프배선'],
      ['3번째', 'LM', '설계 분야/공급사 묶음. UJ = BOP 계측(현대엔지니어링, 2,082건), LM = 터빈 기계(히타치), LJ = 터빈 계측(히타치), LE = 발전기·전기'],
      ['4번째', '105', null],
      ['5번째', '001', '일련번호(같은 종류의 몇 번째 장)']
    ];
    var tbody = el('tbody', {}, rows.map(function (r) {
      return el('tr', {}, [
        el('td', { text: r[0] }),
        el('td', { text: r[1] }),
        r[2] === null
          ? el('td', {}, [el('strong', { text: '도면 종류' }), ' — 105 P&ID, 103 제어로직도, 157 계장루프배선도, 158 C&I, 159 계장위치도, 160 계장설치상세, 162 Functional Block, 163 Level Setting, 164 Operational Graphic, 167 임펄스배관, 168 Functional Loop, 174 외형도, 189 배관도'])
          : el('td', { text: r[2] })
      ]);
    }));
    return el('details', { class: 'dwg-guide' }, [
      el('summary', { text: '도면번호 읽는 법' }),
      el('div', { class: 'dwg-guide-body' }, [
        el('h4', {}, ['발전소(남동발전) 번호 — 예: ', el('code', { text: 'L-31300-LM-105-001' })]),
        el('table', {}, [
          el('thead', {}, [el('tr', {}, [el('th', { text: '자리' }), el('th', { text: '예' }), el('th', { text: '뜻' })])]),
          tbody
        ]),
        el('h4', {}, ['공급사 번호 — 예: ', el('code', { text: '310PB52-576' }), '(히타치), ', el('code', { text: 'TEQ-…' }), ', ', el('code', { text: 'GSE-…' })]),

  // ======================================================================

  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === 'class') node.className = props[k];
        else if (k === 'text') node.textContent = props[k];
        else if (k === 'html_TRUSTED_STATIC') node.innerHTML = props[k]; // 정적 아이콘 SVG 전용
        else if (k.indexOf('on') === 0 && typeof props[k] === 'function') node.addEventListener(k.slice(2), props[k]);
        else node.setAttribute(k, props[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      if (typeof c === 'string') node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

  // The ledger is a source-by-source view, not an authoritative merged equipment master.
  function ledgerRecords(lookup) {
    var records = lookup && lookup.equipment_ledger && lookup.equipment_ledger.records;
    return Array.isArray(records) ? records.filter(function (r) { return r && typeof r === 'object' && !Array.isArray(r); }) : [];
  }
  function ledgerText(value) {
    if (value == null || value === '') return '';
    if (typeof value === 'string') return value.trim();
    if (typeof value === 'number' || typeof value === 'boolean') return String(value);
    return '';
  }
  function ledgerSource(source) {
    if (!source || typeof source !== 'object') return ledgerText(source) || '미확보';
    return [ledgerText(source.file), ledgerText(source.sheet),
      ledgerText(source.row) ? ledgerText(source.row) + '행' : ''].filter(Boolean).join(' · ') || '미확보';
  }
  function ledgerUrl(value) {
    var url = ledgerText(value);
    // No executable/data URLs, embedded credentials, controls or protocol-relative links.
    return /^https?:\/\/[^\s/@?#]+(?:[/?#][^\s]*)?$/i.test(url) && !/[\x00-\x20\x7f\\<>"']/.test(url) ? url : null;
  }
  function ledgerImageUrl(value) {
    var url = ledgerText(value);
    return /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/i.test(url) ? url : null;
  }

  function buildEquipmentLedger(result, summaryBadges) {
    var lookup = result.lookup || {}, records = ledgerRecords(lookup);
    var instruments = Array.isArray(lookup.field_instruments) ? lookup.field_instruments : [];
    var sheets = result.logicSheets || [], setpoints = lookup.setpoints || [];
    function paragraph(text, cls) { return el('p', { class: cls || 'ledger-note', text: text }); }
    function facts(pairs) {
      return el('dl', { class: 'ledger-facts' }, pairs.map(function (p) {
        return el('div', {}, [el('dt', { text: p[0] }), el('dd', { text: ledgerText(p[1]) || '미확인' })]);
      }));
    }
    // 값이 있는 항목만 표로 보이고, 없는 항목은 한 줄로 모아 "자료 없음"으로 알린다
    function factsC(pairs, extraMissing) {

    var pidSection = null, instSection = null, banner = null, logicSection = null;

    // ② P&ID 도면번호 (분야별)
    if (drawings.length) {
      // 도면번호 3번째 자리 코드로 분야 추정 — 추정·미확인 (공식 코드사전 미검토)
      var DWG_DISC = { UJ: '계측제어 (UJ)', LM: '기계 (LM)', LE: '전기 (LE)', LJ: '미분류 (LJ)' };
      function dwgDiscCode(no) {
        if (!no) return null;
        var parts = String(no).trim().replace(/\s+/g, '').split('-');
        var c = parts.length >= 3 ? parts[2] : null;
        return (c && DWG_DISC[c]) ? c : null;
      }
      var pidItems = drawings.map(function (d) {
        var copyBtn = makeCopyBtn(d.dwg_no);
        var openUrl = dwgOpenUrl(d);
        var aliasNote = (d.aliases && d.aliases.length)
          ? el('span', { class: 'dwg-alias', text: ' (= ' + d.aliases.map(function (a) { return supplierLabel(a) + ' ' + a; }).join(', ') + ')' })
          : null;
        return el('div', { class: 'pid-item' }, [
          el('div', { class: 'pid-number-row' }, [
            el('div', { class: 'pid-number' }, [d.dwg_no, aliasNote, stageBadge(d.doc_meta)]),
            openUrl ? el('a', { class: 'pid-open', href: openUrl, target: '_blank', rel: 'noopener' }, ['열기']) : null,
            copyBtn
          ]),
          d.title ? el('div', { class: 'pid-title', text: d.title }) : null,
          el('div', { class: 'pid-confidence', text: TIER_LABEL[d.tier] || '' })
        ]);
      });
      // 분야별 묶음 — 2종 이상일 때 분야 헤더를 삽입한다
      var DWG_DISC_ORDER = ['UJ', 'LM', 'LE', 'LJ'];
      var pidGrouped = {};
      drawings.forEach(function (d, i) {
        var c = dwgDiscCode(d.dwg_no) || '_other';
        if (!pidGrouped[c]) pidGrouped[c] = [];
        pidGrouped[c].push(pidItems[i]);
      });
      var pidGroupCodes = DWG_DISC_ORDER.filter(function (c) { return pidGrouped[c]; });
      if (pidGrouped['_other']) pidGroupCodes.push('_other');
      var pidBlockContent;
      if (pidGroupCodes.length > 1) {
        pidBlockContent = [];
        pidGroupCodes.forEach(function (code) {
          var label = code === '_other' ? '분류 미확인' : DWG_DISC[code];
          pidBlockContent.push(el('div', { class: 'dwg-disc-header' }, [
            el('span', { text: label }),
            el('span', { class: 'dwg-disc-est', text: ' 추정' })
          ]));
          pidGrouped[code].forEach(function (item) { pidBlockContent.push(item); });
        });
      } else {
        pidBlockContent = pidItems;
      }
      pidSection = el('div', { id: 'sec-pid' }, [
        el('div', { class: 'section-title', text: 'P&ID 도면 · 전체 ' + drawings.length + '건' }),
        el('div', { class: 'card pid-block' }, pidBlockContent)
      ]);
      if (pidItems.length > 6) {
        pidItems.slice(6).forEach(function (item) { item.hidden = true; });
        var moreDrawings = el('button', { class: 'retry-btn', type: 'button', text: '나머지 ' + (pidItems.length - 6) + '건 더 보기', onclick: function () {
          pidItems.forEach(function (item) { item.hidden = false; });
          moreDrawings.hidden = true;
        } });
        pidSection.appendChild(moreDrawings);
      }
      pidSection.appendChild(buildDwgGuide());
    }
    // (표시 순서는 아래 "표시 순서" 블록에서 정한다)

    // ③ 현장계기 정보 — 도면번호 확인 후 사양을 먼저 보여 준다
    function docLink(filePath, page, label) {
      var u = drawingUrl(filePath);
      if (!u) return label;
      return el('a', { href: u + (page ? '#page=' + page : ''), target: '_blank', rel: 'noopener', text: label });
    }
    var SOURCE_LABEL = {
      'BOP-INDEX': '★BOP 계기 엑셀',
      'TG-462-001': '준공 계기 리스트 L-30000-LJ-462-001',
      'WT-LIST': '수처리 계기 엑셀 (원본 파일 위치 미확인)'
    };
    if (instruments.length || setpoints.length) {
      var instBlocks = instruments.map(function (fi, idx) {
        var rows = [];
        function row(label, val) {
          val = cleanStr(val);
          if (!val) return;
          rows.push(el('div', { class: 'kv-row' }, [
            el('dt', { text: label }),
            el('dd', { text: val })
          ]));
        }
        function rowEl(label, children) {
          rows.push(el('div', { class: 'kv-row' }, [el('dt', { text: label }), el('dd', {}, children)]));
        }
        row('제조사', fi.maker);
        row('모델', fi.model_no);
        row('레인지', fi.signal_range ? fi.signal_range + (fi.eng_unit ? ' ' + fi.eng_unit : '') : '');
        row('설정치', fi.set_point);
        row('위치', fi.location);
        row('공급사', fi.supplier);
        row('비고', fi.remarks);
        if (fi.pid_dwg_resolved && fi.pid_dwg_resolved.kosep_id && cleanStr(fi.pid_dwg_no) &&
            fi.pid_dwg_resolved.kosep_id !== cleanStr(fi.pid_dwg_no)) {
          row('계기 배치도 번호(참고용)', cleanStr(fi.pid_dwg_no) + ' → ' + fi.pid_dwg_resolved.kosep_id +
            ' (같은 도면, ' + supplierLabel(cleanStr(fi.pid_dwg_no)) + ')');
        } else {
          row('계기 배치도 번호(참고용)', fi.pid_dwg_no);
        }
        if (fi.vendor_dwg_resolved) {
          var vdr = fi.vendor_dwg_resolved;
          var vdrText = vdr.kosep_id + (vdr.title ? ' — ' + cleanStr(vdr.title) : '') + ' ';
          var vdrUrl = drawingUrl(vdr.file_path);
          if (vdrUrl) {
            if (vdr.pdf_page) vdrUrl += '#page=' + vdr.pdf_page;
            rowEl('제작사(OEM) 설치도면', [vdrText, el('a', { class: 'pid-open', href: vdrUrl, target: '_blank', rel: 'noopener', text: '열기' })]);
          } else {
            row('제작사(OEM) 설치도면', vdrText + (vdr.file_path ? '[열람 가능]' : '[목록만 확인됨, 실물 미변환]'));
          }
        }
        var srcLabel = SOURCE_LABEL[fi.source_doc] || cleanStr(fi.source_doc);
        // 공식 인덱스 대조(provenance) — 모든 항목을 보인다. 없거나 비어 있으면 '미확보'로 알린다.
        var pvList = fi.source_doc === 'BOP-INDEX' ? provenance.filter(function (x) { return x && typeof x === 'object'; }) : [];
        function pvNo(x) { return cleanStr(x.doc_no) || '문서번호 미확인'; }
        function pvLink(x) { return docLink(x.file_path, x.pdf_page, pvNo(x) + (x.pdf_page ? ' p.' + x.pdf_page : '')); }
        function pvKids(x, lead) {
          if (x.status === 'matches') return [lead + '공식 인덱스 ', pvLink(x), '와 일치'];
          if (x.status === 'differs') return [lead + '공식 인덱스 ', pvLink(x), '와 다름' + (cleanStr(x.diff_note) ? ' — ' + cleanStr(x.diff_note) : '')];
          if (x.status === 'not_in_official') return [lead + '공식 인덱스(' + pvNo(x) + ')에 없는 태그'];
          return null;
        }
        if (!pvList.length) {
          if (srcLabel) row('출처', srcLabel + (fi.source_doc === 'BOP-INDEX' ? ' · 공식 인덱스 대조 자료 미확보' : ''));
        } else {
          pvList.forEach(function (x, xi) {
            var lead = xi === 0 && srcLabel ? srcLabel + ' · ' : '';
            rowEl(xi === 0 ? '출처' : '공식 인덱스 대조 ' + (xi + 1),
              pvKids(x, lead) || [lead + '공식 인덱스 ', pvLink(x), ' — 대조 상태 미확인']);
          });
        }
        return el('div', { class: 'instrument-block' }, [
          instruments.length > 1 ? el('div', { class: 'instrument-heading', text: (idx + 1) + '. ' + cleanStr(fi.raw_tag || fi.instr_type) }) : null,
          el('dl', { class: 'kv-list' }, rows)
        ]);
      });
      // 공식 세팅치 리스트(문서번호·리비전·원본 쪽)
      setpoints.forEach(function (sp) {
        var rows = [];
        function add(label, children) {
          rows.push(el('div', { class: 'kv-row' }, [el('dt', { text: label }), el('dd', {}, children)]));
        }
        if (cleanStr(sp.set_point)) add('세팅치', [cleanStr(sp.set_point) + (sp.unit ? ' ' + cleanStr(sp.unit) : '')]);
        if (cleanStr(sp.cal_range)) add('교정 레인지', [cleanStr(sp.cal_range)]);
        if (cleanStr(sp.loop_sheet)) add('기능루프도', [cleanStr(sp.loop_sheet)]);
        add('출처', [docLink(sp.file_path, sp.pdf_page, sp.doc_no + ' Rev ' + sp.doc_rev + (sp.pdf_page ? ' p.' + sp.pdf_page : ''))]);
        if (sp.needs_check) add('주의', ['표에서 줄바꿈된 칸을 이어 붙인 값 — 원본 쪽에서 확인하세요']);
        instBlocks.push(el('div', { class: 'instrument-block' }, [
          el('div', { class: 'instrument-heading', text: '공식 세팅치 · ' + cleanStr(sp.raw_tag) + (sp.service_desc ? ' — ' + cleanStr(sp.service_desc) : '') }),
          el('dl', { class: 'kv-list' }, rows)
        ]));
      });
      instSection = el('div', { id: 'sec-inst' }, [
        el('div', { class: 'section-title', text: '현장계기 정보' }),
        el('div', { class: 'card' }, instBlocks)
      ]);
    }

    // ④ 트립·인터록 배너
    if (tripSheets.length) {
      var iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
      banner = el('div', { class: 'banner', id: 'sec-trip' }, [
        el('span', { html_TRUSTED_STATIC: iconSvg }),
        el('span', {}, [
          el('strong', { text: '트립·인터록 관련으로 보이는 시트가 ' + tripSheets.length + '건 있습니다. ' }),
          '실제 트립 발생 여부는 해당 로직 시트를 직접 확인하세요. (제목 키워드 기반 자동 분류이며 근거로 삼기에 충분하지 않을 수 있습니다.)'
        ])
      ]);
    } else if (logicSheets.length) {
      var note = el('div', { class: 'banner', id: 'sec-trip' }, [
        el('span', {}, ['제목 기준으로는 트립 관련 시트가 확인되지 않았습니다. 본문에 포함되어 있을 수 있습니다.'])
      ]);
      note.style.background = 'var(--bg-sunken)';
      note.style.color = 'var(--fg-muted)';
      banner = note;
    }

    // ⑤ 로직 사용처
    if (logicSheets.length) {
      var logicItems = logicSheets.map(function (s, idx) {
        var isTrip = s.categories.indexOf('trip') !== -1;
        var sourceBadge = s.sources.usage
          ? el('span', { class: 'badge badge-confirmed', text: '신호 연결' })
          : el('span', { class: 'badge badge-mentioned', text: '본문 언급' });
        var metaRow = el('div', { class: 'logic-meta' }, s.categories.map(function (c) { return badge(c); }).concat([sourceBadge]));
        return el('div', { class: 'logic-item' + (isTrip ? ' is-trip' : '') + (idx === 0 ? ' is-first-item' : '') }, [
          el('div', { class: 'logic-sheet-no', text: s.drop_no + '/' + s.sheet_no }),
          el('div', { class: 'logic-body' }, [
            el('div', { class: 'logic-title', text: s.title || '(제목 없음)' }),
            metaRow,
            logicPageUrl(s) ? el('a', { class: 'pid-open', href: logicPageUrl(s), target: '_blank', rel: 'noopener', text: '원본 p.' + s.pdf_page + ' 열기' }) : null,
            s.pdf_page != null ? el('div', { class: 'logic-page', text: '도면집 p.' + s.pdf_page + ' · ' + s.logic_book }) : el('div', { class: 'logic-page', text: s.logic_book })
          ])
        ]);
      });
      logicSection = el('div', { id: 'sec-logic' }, [
        el('div', { class: 'section-title', text: (keywordMode ? '로직 시트 검색결과 (' : '로직 사용처 (') + logicSheets.length + '건)' }),
        el('div', { class: 'card logic-list' }, logicItems)
      ]);
    }

    // ===== 표시 순서: 답 카드 → 트립 배너 → 검토된 설명/자동추출 → 로직 사용처 → P&ID → 현장계기 → 설비대장 → 나머지 =====
    function jump(id, text) {
      return el('a', { class: 'answer-jump', href: '#' + id, text: text, onclick: function (event) {
        event.preventDefault();
        var target = document.getElementById(id);
        if (target) target.scrollIntoView({ block: 'start' });
      } });
    }
    var answerKids = [
      el('p', { class: 'answer-tag', text: result.rawInput.trim().toUpperCase() }),
      primaryDesc ? el('p', { class: 'answer-desc', text: primaryDesc }) : null
    ];
    // 1) 트립·인터록: 제목 키워드 판정(tripSheets)과 시트 연결 판정(tag_auto)을 합쳐 더 심각한 쪽을 보인다
    if (tripAny) {
      var tripHead, tripBasis, tripJump;
      if (tripSheets.length && autoTrip) {
        tripHead = '관련 시트 ' + tripSheets.length + '건 있음'; tripBasis = ' (제목 키워드 + 시트 연결 기준)';
        tripJump = jump('sec-logic', '로직 사용처 ↓');
      } else if (tripSheets.length) {
        tripHead = '관련 시트 ' + tripSheets.length + '건 있음'; tripBasis = ' (제목 키워드 기준)';
        tripJump = jump('sec-logic', '로직 사용처 ↓');
      } else {
        tripHead = '트립·인터록 시트와 ' + (tagAuto.trip_level === 'direct' ? '직접' : '간접(2단계)') + ' 연결됨';
        tripBasis = ' (시트 연결 기준, 제목 키워드 시트는 없음)';
        tripJump = jump('sec-auto', '자동 추출 ↓');
      }
      answerKids.push(el('div', { class: 'answer-line is-trip' }, [
        el('span', { class: 'answer-label', text: '트립·인터록' }),
        el('strong', { text: tripHead }), tripBasis, tripJump
      ]));
    } else if (logicSheets.length) {
      answerKids.push(el('div', { class: 'answer-line is-logic' }, [
        el('span', { class: 'answer-label', text: '트립·인터록' }),
        el('strong', { text: '로직 사용처 ' + logicSheets.length + '건, 트립 키워드 시트 없음' }),
        ' (제목 기준' + (tagAuto ? ', 시트 연결 기준으로도 찾지 못함' : '') + ')', jump('sec-logic', '로직 사용처 ↓')
      ]));
    } else {
      answerKids.push(el('div', { class: 'answer-line is-none' }, [
        el('span', { class: 'answer-label', text: '트립·인터록' }),
        '조회한 자료에서 로직 사용처를 찾지 못함 (트립 신호가 아니라는 뜻은 아님)'
      ]));
    }
    // 2) P&ID — 상위 2건 (열기/복사)
    if (drawings.length) {
      var pidLine = [el('span', { class: 'answer-label', text: 'P&ID 도면' + (drawings.length > 2 ? ' (상위 2건 / 전체 ' + drawings.length + '건)' : '') })];
      drawings.slice(0, 2).forEach(function (d) {
        var u = dwgOpenUrl(d);
        pidLine.push(el('div', { class: 'answer-pid' }, [
          el('span', { class: 'pid-number' }, [d.dwg_no, stageBadge(d.doc_meta)]),
          u ? el('a', { class: 'pid-open', href: u, target: '_blank', rel: 'noopener' }, ['열기']) : null,
          makeCopyBtn(d.dwg_no)
        ]));
      });
      pidLine.push(el('div', {}, [jump('sec-pid', 'P&ID 목록 ↓')]));
      answerKids.push(el('div', { class: 'answer-line is-plain' }, pidLine));
    } else {
      answerKids.push(el('div', { class: 'answer-line is-missing' }, [el('span', { class: 'answer-label', text: 'P&ID 도면' }), '조회한 자료에 없음']));
    }
    // 3) 제조사/모델 — 현장계기 정보, 없으면 설비대장 원문에서
    var makerModel = '';
    if (instruments.length) makerModel = [cleanStr(instruments[0].maker), cleanStr(instruments[0].model_no)].filter(Boolean).join(' · ');
    if (!makerModel) {
      var lr = ledgerRecords(lookup);
      for (var li = 0; li < lr.length && !makerModel; li++) makerModel = [ledgerText(lr[li].manufacturer), ledgerText(lr[li].model)].filter(Boolean).join(' · ');
    }
    if (makerModel) {
      answerKids.push(el('div', { class: 'answer-line is-plain' }, [
        el('span', { class: 'answer-label', text: '제조사 · 모델' }),
        makerModel + (instruments.length > 1 ? ' (외 계기 ' + (instruments.length - 1) + '건)' : ''),
        instSection ? jump('sec-inst', '현장계기 ↓') : jump('ledger-specs', '설비대장 ↓')
      ]));
    } else {
      answerKids.push(el('div', { class: 'answer-line is-missing' }, [el('span', { class: 'answer-label', text: '제조사 · 모델' }), '조회한 자료에 없음']));
    }
    answerKids.push(el('p', { class: 'answer-caveat', text: '검토 전 자료입니다. 최신성·현장 일치 여부는 확인되지 않았습니다. 미확인은 값 없음, 미확보는 근거 없음을 뜻합니다.' }));
    if (keywordMode) {
      results.appendChild(el('div', { class: 'section-title', text: '키워드로 검색한 결과입니다 (태그 형식 아님, 태그 자료는 조회되지 않음)' }));
      if (logicSection) results.appendChild(logicSection);
    } else {
      results.appendChild(el('div', { class: 'card answer-card' }, answerKids));
      if (banner) results.appendChild(banner);
      if (tagNote) results.appendChild(buildTagNote(tagNote));
      if (tagAuto) results.appendChild(buildTagAuto(tagAuto, !!tagNote));
      if (logicSection) results.appendChild(logicSection);
      if (pidSection) results.appendChild(pidSection);
      if (instSection) results.appendChild(instSection);
      if (valueConflicts.length) results.appendChild(buildConflicts(valueConflicts));
      results.appendChild(summaryCard);
    }

    // ⑥ 관련 도면 (접힘)
    var relGroups = Object.keys(relatedDrawings);
    var relHasFile = false;
    if (relGroups.length) {
      var relBody = relGroups.map(function (groupName) {
        var items = relatedDrawings[groupName].map(function (d) {
          // 묶음 PDF(ILWD 합본 등)면 pdf_page로 해당 쪽을 바로 연다
          var relUrl = drawingUrl(d.file_path);
          if (relUrl && d.pdf_page) relUrl += '#page=' + d.pdf_page;
          if (relUrl) relHasFile = true;
          return el('div', { class: 'related-item' }, [
            el('div', { class: 'pid-number-row' }, [
              el('div', { class: 'related-dwg' }, [cleanStr(d.kosep_id || d.dwg_no), stageBadge(d.doc_meta)]),
              relUrl ? el('a', { class: 'pid-open', href: relUrl, target: '_blank', rel: 'noopener',
                text: d.pdf_page ? '열기 (합본 p.' + d.pdf_page + ')' : '열기' }) : null
            ]),
            el('div', { class: 'related-title', text: cleanStr(d.title) })
          ]);
        });
        return el('div', { class: 'related-group' }, [
          el('div', { class: 'related-group-title', text: groupName }),
          el('div', {}, items)
        ]);
      });
      // 열 수 있는 도면이 있으면 펼친 상태로 보여 준다
      var relDetails = el('details', relHasFile ? { class: 'card', open: '' } : { class: 'card' }, [
        el('summary', {}, [
          el('span', { text: '관련 도면' }),
          el('span', { class: 'count', text: relGroups.length + '종' })
        ]),
        el('div', { class: 'details-body no-pad-top' }, relBody)
      ]);
      results.appendChild(relDetails);
    }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ======================================================================
  // §7 상태 / 최근검색 / 테마 / 라우팅
  // ======================================================================
  function getRecent() {
    try {
      var raw = localStorage.getItem(RECENT_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function pushRecent(tag) {
    try {
      var list = getRecent().filter(function (t) { return t !== tag; });
      list.unshift(tag);
      list = list.slice(0, 8);
      localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  var currentToken = 0;
  var lastHashTag = null; // 앱이 마지막으로 해시에 반영한 태그 — hashchange가 자기 검색을 되풀이하지 않게 한다
  function doSearch(tag) {
    tag = (tag || '').trim();
    if (!tag) { ++currentToken; searchBtn.disabled = false; renderIntro(); return; }
    var token = ++currentToken;
    searchBtn.disabled = true;
    renderLoading(tag);
    lastHashTag = tag;
    location.hash = '#tag=' + encodeURIComponent(tag);
    runSearch(tag).then(function (result) {
      if (token !== currentToken) return;
      pushRecent(tag.trim().toUpperCase());
      renderResults(result);
    }).catch(function (err) {
      if (err instanceof McpError && err.kind === 'auth') { searchBtn.disabled = false; return; }
      if (token !== currentToken) return;
      renderError(err, tag);
    }).then(function () {
      if (token === currentToken) searchBtn.disabled = false;
    });
  }

  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    doSearch(searchInput.value);
  });

  // 테마 토글
  var themeToggle = document.getElementById('themeToggle');
  var iconSun = document.getElementById('themeIconSun');
  var iconMoon = document.getElementById('themeIconMoon');
  function currentTheme() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr) return attr;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncThemeIcon() {
    var t = currentTheme();
    iconSun.style.display = t === 'dark' ? '' : 'none';
    iconMoon.style.display = t === 'dark' ? 'none' : '';
  }
  themeToggle.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    syncThemeIcon();
  });
  syncThemeIcon();

  // 초기 로드: 해시 라우팅
  function initFromHash() {
    var m = /#tag=([^&]+)/.exec(location.hash);
    if (m) {
      var tag = decodeURIComponent(m[1]);
      searchInput.value = tag;
      doSearch(tag);
    } else {
      renderIntro();
    }
  }
  initFromHash();
  resumeAfterUnlock = initFromHash;

  // 뒤로/앞으로 가기: 해시가 바뀌면 그 태그로 다시 검색한다.
  // 잠금 중에는 아무것도 하지 않는다(잠금 해제 후 resumeAfterUnlock이 현재 해시를 처리).
  window.addEventListener('hashchange', function () {
    if (!catalogToken) return;
    var m = /#tag=([^&]+)/.exec(location.hash);
    if (m) {
      var tag;
      try { tag = decodeURIComponent(m[1]); } catch (e) { return; }
      if (tag === lastHashTag) return; // 앱이 직접 바꾼 해시(또는 이미 보고 있는 태그)
      initFromHash();
    } else if (location.hash === '' || location.hash === '#') {
      if (lastHashTag === null) return;
      lastHashTag = null;
      ++currentToken; searchBtn.disabled = false;
      renderIntro();
    }
    // 그 외 해시(#sec-logic 같은 화면 내 이동)는 무시
  });

    var isTag  = (tab === 'tag');

    tabTagSearch.classList.toggle('app-tab--active', isTag);
    tabTagSearch.setAttribute('aria-selected', String(isTag));
    tabCatalog.classList.toggle('app-tab--active', isCat);
    tabCatalog.setAttribute('aria-selected', String(isCat));
    tabEquipment.classList.toggle('app-tab--active', isEquip);
    tabEquipment.setAttribute('aria-selected', String(isEquip));
    if (isTag) {
      paneTagSearch.removeAttribute('hidden');
      paneCatalog.setAttribute('hidden', '');
      paneEquipment.setAttribute('hidden', '');
    } else if (isCat) {
      paneCatalog.removeAttribute('hidden');
      paneTagSearch.setAttribute('hidden', '');
      paneEquipment.setAttribute('hidden', '');
      // Auto-load on first visit (token already set by front gate)
      ensureCatalogSession().then(function() {
        if (catalogResults.children.length === 0) loadCatalog(1);
      });
    } else {
      paneEquipment.removeAttribute('hidden');
      paneTagSearch.setAttribute('hidden', '');
      paneCatalog.setAttribute('hidden', '');

  function ensureCatalogSession() {

  // ── Discipline label helper ──

  function renderCatalogResults(data) {

  function showCatalogStatus(msg, isError) {
    catalogResults.innerHTML = '';
    var s = document.createElement('div');
    s.className = 'catalog-status';
    if (isError) s.style.color = 'var(--error, #c33)';
    s.textContent = msg;
    catalogResults.appendChild(s);
    catalogPager.innerHTML = '';
  }

  function renderCatalogPager(data) {
    catalogPager.innerHTML = '';
    if (!data) return;
    var total = data.total || 0;
    var page = data.page || 1;
    var pages = Math.max(1, Math.ceil(total / (data.page_size || CATALOG_PAGE_SIZE)));
    var info = document.createElement('span');
    info.textContent = '총 ' + total + '건 · ' + page + ' / ' + pages + ' 페이지';
    catalogPager.appendChild(info);

    var prev = document.createElement('button');
    prev.textContent = '이전';
    prev.disabled = page <= 1;
    prev.addEventListener('click', function () { loadCatalog(page - 1); });
    catalogPager.appendChild(prev);

    var next = document.createElement('button');
    next.textContent = '다음';
    next.disabled = page >= pages;
    next.addEventListener('click', function () { loadCatalog(page + 1); });
    catalogPager.appendChild(next);
  }

  function loadCatalog(page) {
    if (!catalogToken) {
      showCatalogStatus('로딩 중…', false);
      ensureCatalogSession().then(function () {
        if (catalogToken) loadCatalog(page);
        else showCatalogStatus('인증되지 않았습니다. PIN을 입력 후 도면 자료실 탭을 열어주세요.', true);
      });
      return;
    }
    catalogPage = page || 1;
    showCatalogStatus('로딩 중…', false);
    var params = new URLSearchParams();
    params.set('page', String(catalogPage));
    params.set('page_size', String(CATALOG_PAGE_SIZE));
    if (catalogSource) params.set('source', catalogSource);
    if (catalogDiscipline && !catalogSource) params.set('discipline', catalogDiscipline);
    if (catalogQ) params.set('q', catalogQ);

    fetch(CATALOG_BASE + '/catalog/drawings?' + params.toString(), {
      headers: { 'Authorization': 'Bearer ' + catalogToken }
    })
      .then(function (res) {
        if (res.status === 401) { relock('세션이 만료되었습니다. PIN을 다시 입력하세요.'); return null; }
        if (!res.ok) { showCatalogStatus('서버 오류 (' + res.status + ')', true); return null; }
        return res.json();
      })
      .then(function (data) {
        if (data) {
          // Normalize: Worker returns {rows}, UI expects {drawings}
          if (data.rows && !data.drawings) data.drawings = data.rows;
          renderCatalogResults(data);
        }
      })
      .catch(function (e) { showCatalogStatus('네트워크 오류: ' + e.message, true); });
  }

  function renderEquipmentResults(data) {
    equipResults.innerHTML = '';
    var frag = document.createDocumentFragment();

    // Header
    var header = document.createElement('div');
    header.style.cssText = 'margin-bottom:12px;';
    var title = document.createElement('h2');
    title.style.cssText = 'font-size:1rem;font-weight:600;margin:0 0 4px;';
    title.textContent = data.label || data.name;
    header.appendChild(title);
    if (data.description) {
      var desc = document.createElement('p');
      desc.style.cssText = 'font-size:0.75rem;color:var(--muted);margin:0 0 4px;';
      desc.textContent = data.description;
      header.appendChild(desc);
    }
    // Counts summary
    var counts = data.counts || {};
    var summary = document.createElement('div');
    summary.style.cssText = 'font-size:0.75rem;color:var(--muted);margin-bottom:4px;';
    summary.textContent = '전체 ' + (counts.total || 0) + '개 · verified ' + (counts.verified || 0) + '개 · candidate ' + (counts.candidate || 0) + '개';
    header.appendChild(summary);
    // Missing-section notice
    if (data.missing_sections && data.missing_sections.length > 0) {
      var missDiv = document.createElement('div');
      missDiv.style.cssText = 'font-size:0.72rem;color:var(--error,#c33);background:var(--bg-alt,#fdf6f6);border:1px solid var(--error,#c33);border-radius:4px;padding:4px 8px;margin-top:4px;';
      missDiv.textContent = '⚠ 미완료: ' + data.missing_sections.join(' · ');
      header.appendChild(missDiv);
    }
    if (data.notice) {
      var noticeDiv = document.createElement('div');
      noticeDiv.style.cssText = 'font-size:0.68rem;color:var(--muted);margin-top:4px;';
      noticeDiv.textContent = '※ ' + data.notice;
      header.appendChild(noticeDiv);
    }
    frag.appendChild(header);

    // Verified tags section
    if (data.verified && data.verified.length > 0) {
      var vSect = document.createElement('details');
      vSect.setAttribute('open', '');
      var vSum = document.createElement('summary');
      vSum.style.cssText = 'font-weight:600;font-size:0.85rem;cursor:pointer;padding:4px 0;';
      vSum.textContent = '✓ 계기리스트 확정 태그 (' + data.verified.length + '개)';
      vSect.appendChild(vSum);
      data.verified.forEach(function (t) {
        var row = document.createElement('div');
        row.style.cssText = 'padding:6px 0 6px 8px;border-bottom:1px solid var(--border);';
        var tagEl = document.createElement('span');
        tagEl.style.cssText = 'font-weight:600;font-family:monospace;font-size:0.85rem;';
        tagEl.textContent = t.base_tag;
        row.appendChild(tagEl);
        if (t.drawings && t.drawings.length > 0) {
          var dwgList = document.createElement('ul');
          dwgList.style.cssText = 'margin:2px 0 0 12px;padding:0;list-style:disc;font-size:0.75rem;color:var(--muted);';
          t.drawings.forEach(function (d) {
            var li = document.createElement('li');
            li.textContent = d.dwg_kind + ': ' + d.dwg_no + (d.title ? ' — ' + d.title : '');
            dwgList.appendChild(li);
          });
          row.appendChild(dwgList);
        }
        if (t.logic_sheet_ids && t.logic_sheet_ids.length > 0) {
          var sheetEl = document.createElement('div');
          sheetEl.style.cssText = 'font-size:0.68rem;color:var(--muted);margin-top:2px;margin-left:8px;';
          sheetEl.textContent = '로직 시트: ' + t.logic_sheet_ids.length + '개';
          row.appendChild(sheetEl);
        }
        vSect.appendChild(row);
      });
      frag.appendChild(vSect);
    }

    // Candidate tags section
    if (data.candidate && data.candidate.length > 0) {
      var cSect = document.createElement('details');
      cSect.setAttribute('open', '');
      var cSum = document.createElement('summary');
      cSum.style.cssText = 'font-weight:600;font-size:0.85rem;cursor:pointer;padding:4px 0;color:var(--warn,#b97000);';
      cSum.textContent = '⚠ 로직시트 확인만 (P&ID/IID 미매핑) (' + data.candidate.length + '개)';
      cSect.appendChild(cSum);
      data.candidate.forEach(function (t) {
        var row = document.createElement('div');
        row.style.cssText = 'padding:6px 0 6px 8px;border-bottom:1px solid var(--border);';
        var tagEl = document.createElement('span');
        tagEl.style.cssText = 'font-weight:600;font-family:monospace;font-size:0.85rem;';
        tagEl.textContent = t.base_tag;
        row.appendChild(tagEl);
        if (t.missing_sections && t.missing_sections.length > 0) {
          var missEl = document.createElement('div');
          missEl.style.cssText = 'font-size:0.72rem;color:var(--error,#c33);margin-left:8px;margin-top:1px;';
          missEl.textContent = '미완료: ' + t.missing_sections.join(', ');
          row.appendChild(missEl);
        }
        if (t.logic_sheet_ids && t.logic_sheet_ids.length > 0) {
          var tagSearch = document.createElement('a');
          tagSearch.href = '#';
          tagSearch.style.cssText = 'font-size:0.75rem;margin-left:8px;';
          tagSearch.textContent = '태그 검색으로 보기';
          tagSearch.setAttribute('data-tag', t.base_tag);
          tagSearch.addEventListener('click', function (e) {
            e.preventDefault();
            var tag = this.getAttribute('data-tag');
            var searchInput = document.getElementById('searchInput');
            var searchForm = document.getElementById('searchForm');
            if (searchInput && searchForm) {
              activateTab('tag');
              searchInput.value = tag;
              searchForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
            }
          });
          row.appendChild(tagSearch);
          var sheetEl = document.createElement('div');
          sheetEl.style.cssText = 'font-size:0.68rem;color:var(--muted);margin-top:2px;margin-left:8px;';
          sheetEl.textContent = '로직 시트: ' + t.logic_sheet_ids.length + '개';
          row.appendChild(sheetEl);
        }
        cSect.appendChild(row);
      });
      frag.appendChild(cSect);
    }

    equipResults.appendChild(frag);
  }

  // Equipment filter buttons
  document.querySelectorAll('.equip-filter').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.equip-filter').forEach(function (b) {
        b.classList.remove('equip-filter--active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('equip-filter--active');
      btn.setAttribute('aria-pressed', 'true');
      var groupName = btn.getAttribute('data-equip') || '';
      if (groupName) {
        equipResults.innerHTML = '';
        ensureCatalogSession().then(function () { loadEquipment(groupName); });
      }
    });
  });

  }
})();
</script>
